<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบวิชานาฏศิลป์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E2761;
    --navy-light:#CADCFC;
    --ink:#1A1A1A;
    --bg:#F5F5F5;
    --card:#FFFFFF;
    --border:#E0E3EA;
    --green:#1B7F3A;
    --green-bg:#E7F5EC;
    --red:#B3261E;
    --red-bg:#FBEAE9;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Sarabun','TH Sarabun New',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    margin:0;
    padding:0;
    font-size:11pt;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:28px 20px 22px;
    text-align:center;
  }
  header h1{
    font-size:18pt;
    margin:0 0 6px;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:11pt;
    color:var(--navy-light);
  }
  .wrap{
    max-width:860px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .setbar{
    display:flex;
    gap:10px;
    margin:22px 0 18px;
    flex-wrap:wrap;
  }
  .setbtn{
    flex:1;
    min-width:150px;
    padding:14px 10px;
    border:1.5px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-family:inherit;
    font-size:12pt;
    font-weight:600;
    border-radius:4px;
    cursor:pointer;
    text-align:center;
  }
  .setbtn.active{
    background:var(--navy);
    color:#fff;
  }
  .panel{
    display:none;
  }
  .panel.active{
    display:block;
  }
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    border:1px solid var(--border);
    border-radius:4px;
    padding:12px 16px;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .score{
    font-size:12pt;
    font-weight:700;
    color:var(--navy);
  }
  .reshuffle{
    background:#fff;
    border:1px solid var(--navy);
    color:var(--navy);
    font-family:inherit;
    padding:8px 14px;
    font-size:10pt;
    border-radius:4px;
    cursor:pointer;
  }
  .reshuffle:hover{background:var(--navy-light);}
  .qcard{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:4px;
    padding:18px 18px 16px;
    margin-bottom:14px;
  }
  .qnum{
    font-size:9pt;
    color:#666;
    margin-bottom:4px;
    letter-spacing:.3px;
  }
  .qtext{
    font-size:12pt;
    font-weight:600;
    color:var(--ink);
    margin-bottom:12px;
    line-height:1.5;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid #C9CDD6;
    border-radius:4px;
    padding:10px 12px;
    margin-bottom:8px;
    font-family:inherit;
    font-size:11pt;
    color:var(--ink);
    cursor:pointer;
    transition:background .1s;
  }
  .opt:hover:not(:disabled){background:#F0F3FA;}
  .opt:disabled{cursor:default;}
  .opt.correct{
    background:var(--green-bg);
    border-color:var(--green);
    color:var(--green);
    font-weight:600;
  }
  .opt.wrong{
    background:var(--red-bg);
    border-color:var(--red);
    color:var(--red);
    font-weight:600;
  }
  .explain{
    display:none;
    margin-top:10px;
    padding:10px 12px;
    background:#F2F4F8;
    border-left:3px solid var(--navy);
    border-radius:2px;
    font-size:10.5pt;
    line-height:1.5;
    color:#333;
  }
  .explain.show{display:block;}
  .explain b{color:var(--navy);}
  footer{
    text-align:center;
    color:#888;
    font-size:9pt;
    padding:20px;
  }
  .progresswrap{
    background:#E4E7EE;
    border-radius:3px;
    height:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progressbar{
    background:var(--navy);
    height:100%;
    width:0%;
    transition:width .2s;
  }
</style>
</head>
<body>

<header>
  <a href="index.html" style="display:inline-block;margin-bottom:12px;color:#CADCFC;font-weight:600;font-size:10.5pt;border:1px solid #CADCFC;border-radius:4px;padding:5px 12px;text-decoration:none;">&larr; กลับหน้าเลือกวิชา</a>
  <h1>แบบทดสอบวิชานาฏศิลป์</h1>
  <p>ความรู้ทั่วไปนาฏศิลป์ไทย · นาฏยศัพท์และรูปแบบการแสดง · ละคร · การจัดการแสดงละคร</p>
</header>

<div class="wrap">
  <div class="setbar">
    <button class="setbtn active" data-set="easy">ชุดง่าย (40 ข้อ)</button>
    <button class="setbtn" data-set="medium">ชุดปานกลาง (40 ข้อ)</button>
    <button class="setbtn" data-set="hard">ชุดยาก (40 ข้อ)</button>
  </div>

  <div id="panel-easy" class="panel active"></div>
  <div id="panel-medium" class="panel"></div>
  <div id="panel-hard" class="panel"></div>
</div>

<footer>สลับลำดับข้อและตัวเลือกใหม่ทุกครั้งที่เปิดหน้านี้ · กดปุ่ม "สลับข้อสอบใหม่" เพื่อสุ่มใหม่โดยไม่ต้องรีโหลดหน้า</footer>

<script>
const QUESTION_DATA = {"easy": [{"id": "E1", "chapter": 1, "q": "นาฏศิลป์ตามพจนานุกรมฉบับราชบัณฑิตยสถาน พ.ศ. 2554 หมายถึงข้อใด?", "opts": ["ศิลปะแห่งการละครหรือการฟ้อนรำ", "การเล่นกีฬาไทยโบราณ", "การทำอาหารประจำชาติ", "ดนตรีไทยเพียงอย่างเดียว"], "explain": "พจนานุกรมฉบับราชบัณฑิตยสถาน พ.ศ. 2554 ให้ความหมายนาฏศิลป์ว่า ศิลปะแห่งการละครหรือการฟ้อนรำ"}, {"id": "E2", "chapter": 1, "q": "นาฏศิลป์ไทยมีที่มาจากกี่แหล่งตามที่บทเรียนระบุ?", "opts": ["4 แหล่ง", "2 แหล่ง", "3 แหล่ง", "5 แหล่ง"], "explain": "มีที่มา 4 แหล่ง คือ การละเล่นของชาวบ้าน การรับอารยธรรมอินเดีย การแสดงที่เป็นแบบแผน และการเลียนแบบธรรมชาติ"}, {"id": "E3", "chapter": 1, "q": "เทพเจ้าองค์ใดของอินเดียที่ถือเป็น “นาฏราชา” หรือราชาแห่งการร่ายรำ?", "opts": ["พระอิศวร", "พระพรหม", "พระนารายณ์", "พระอินทร์"], "explain": "ชาวอินเดียเชื่อว่าพระอิศวรทรงเป็นนาฏราชา และเป็นผู้บันทึกท่ารำไว้"}, {"id": "E4", "chapter": 1, "q": "ข้อใดไม่ใช่องค์ประกอบของนาฏศิลป์ไทย?", "opts": ["การแข่งขันกีฬา", "การฟ้อนรำ", "จังหวะ", "เครื่องดนตรี"], "explain": "องค์ประกอบของนาฏศิลป์ไทยมี 7 อย่าง ไม่รวมการแข่งขันกีฬา"}, {"id": "E5", "chapter": 1, "q": "“ระบำ” มีลักษณะการแสดงอย่างไร?", "opts": ["ร่ายรำพร้อมกันเป็นหมู่ ไม่ดำเนินเรื่องราว", "ดำเนินเรื่องราวชัดเจนตลอดเรื่อง", "สวมหน้ากากแสดงเสมอ", "ใช้นักแสดงเพียงคนเดียวเท่านั้น"], "explain": "ระบำเป็นศิลปะการร่ายรำที่แสดงพร้อมกันเป็นหมู่ เน้นความพร้อมเพรียง ไม่ดำเนินเรื่องราว"}, {"id": "E6", "chapter": 1, "q": "ลักษณะเด่นของ “โขน” คือข้อใด?", "opts": ["นักแสดงสวมหน้ากากหรือหัวโขน", "ไม่มีดนตรีประกอบการแสดง", "นักแสดงพูดบทเอง", "ใช้นักแสดงหญิงล้วน"], "explain": "โขนเป็นนาฏศิลป์ที่นักแสดงสวมหัวโขน มีผู้พากย์-เจรจาแทน"}, {"id": "E7", "chapter": 1, "q": "ข้อใดคือปัจจัยที่มีผลต่อการเปลี่ยนแปลงนาฏศิลป์ไทย?", "opts": ["นโยบายของรัฐ", "สภาพอากาศ", "ราคาน้ำมัน", "จำนวนประชากร"], "explain": "ปัจจัยตามบทเรียนมี 4 ข้อ ได้แก่ นโยบายรัฐ สภาพสังคม ค่านิยม และยุคสมัยที่เปลี่ยนแปลง"}, {"id": "E8", "chapter": 1, "q": "พระราชบัญญัติวัฒนธรรมที่กำหนดประเภทของละครไทยประกาศใช้ปี พ.ศ. ใด?", "opts": ["2485", "2475", "2495", "2500"], "explain": "พ.ร.บ. วัฒนธรรม พ.ศ. 2485 กำหนดประเภทละครไว้เพียง 14 ประเภท"}, {"id": "E9", "chapter": 1, "q": "“นาฏศิลป์ร่วมสมัย” หมายถึงข้อใด?", "opts": ["การผสมผสานนาฏศิลป์ไทยกับนาฏศิลป์ตะวันตก", "การแสดงโขนแบบดั้งเดิมเท่านั้น", "การเลิกใช้เครื่องดนตรีไทยทั้งหมด", "การแสดงที่ไม่มีผู้ชม"], "explain": "ยุคสมัยที่เปลี่ยนแปลงทำให้เกิดนาฏศิลป์ร่วมสมัยซึ่งผสมผสานรูปแบบไทยกับตะวันตก"}, {"id": "E10", "chapter": 1, "q": "ข้อใดเป็นตัวอย่างของ “ฟ้อน”?", "opts": ["ฟ้อนเล็บ", "ระบำเทพบันเทิง", "รำฉุยฉาย", "ละครใน"], "explain": "ฟ้อนเป็นศิลปะการร่ายรำท้องถิ่น เช่น ฟ้อนเล็บ ฟ้อนเทียน ฟ้อนเงี้ยว"}, {"id": "E11", "chapter": 2, "q": "“นาฏยศัพท์” หมายถึงข้อใด?", "opts": ["ศัพท์เฉพาะที่ใช้ในวงการนาฏศิลป์และละคร", "ภาษาโบราณของไทย", "ชื่อเพลงไทยเดิม", "ชื่อเครื่องดนตรีไทย"], "explain": "นาฏยศัพท์คือศัพท์เฉพาะที่ใช้สื่อความหมายของท่าทางในวงการนาฏศิลป์และละคร"}, {"id": "E12", "chapter": 2, "q": "“การตั้งวง” แบ่งออกเป็นกี่ระดับ?", "opts": ["3 ระดับ", "2 ระดับ", "4 ระดับ", "5 ระดับ"], "explain": "การตั้งวงแบ่งเป็น 3 ระดับ คือ วงบน วงกลาง วงล่าง"}, {"id": "E13", "chapter": 2, "q": "การจีบมือแบ่งเป็นกี่แบบ?", "opts": ["2 แบบ", "1 แบบ", "3 แบบ", "4 แบบ"], "explain": "การจีบแบ่งเป็นจีบหงายและจีบคว่ำ"}, {"id": "E14", "chapter": 2, "q": "“รำวงมาตรฐาน” พัฒนามาจากการละเล่นชนิดใด?", "opts": ["รำโทน", "รำเซิ้ง", "รำวงกลองยาว", "ฟ้อนเล็บ"], "explain": "รำวงมาตรฐานมีวิวัฒนาการมาจากการละเล่นพื้นบ้านที่เรียกว่ารำโทน"}, {"id": "E15", "chapter": 2, "q": "รำวงมาตรฐานทั้งหมดมีกี่เพลง?", "opts": ["10 เพลง", "8 เพลง", "9 เพลง", "12 เพลง"], "explain": "รำวงมาตรฐานมีทั้งหมด 10 เพลง รวม 17 ท่ารำ"}, {"id": "E16", "chapter": 2, "q": "นาฏศิลป์พื้นบ้านภาคใต้ที่กล่าวถึงในบทเรียนคือชุดใด?", "opts": ["รองเง็ง", "ฟ้อนเงี้ยว", "เซิ้งกระติบข้าว", "รำเหย่อย"], "explain": "รองเง็งเป็นนาฏศิลป์พื้นบ้านภาคใต้ที่ได้รับอิทธิพลจากราชสำนักมาเลเซีย"}, {"id": "E17", "chapter": 2, "q": "“เซิ้งกระติบข้าว” เป็นนาฏศิลป์พื้นบ้านของภาคใด?", "opts": ["ภาคอีสาน", "ภาคเหนือ", "ภาคกลาง", "ภาคใต้"], "explain": "เซิ้งกระติบข้าวสะท้อนวิถีชีวิตและการประกอบอาชีพของชาวอีสาน"}, {"id": "E18", "chapter": 2, "q": "ระบำมาตรฐานที่กล่าวถึงในบทเรียนมีชื่อชุดว่าอะไร?", "opts": ["ระบำกฤดาภินิหาร", "ระบำเทพบันเทิง", "ระบำฉิ่ง", "ระบำเริงอรุณ"], "explain": "ระบำกฤดาภินิหารเป็นระบำมาตรฐานที่ยกตัวอย่างในบทเรียน"}, {"id": "E19", "chapter": 2, "q": "ข้อใดคือท่าทางที่ใช้แทนคำพูด?", "opts": ["ท่าเรียก", "ท่ารัก", "ท่าโกรธ", "ท่าร้องไห้"], "explain": "ท่าเรียกและท่าปฏิเสธจัดเป็นท่าทางที่ใช้แทนคำพูด ส่วนท่ารัก โกรธ ขัดเคืองใจ ร้องไห้ เป็นท่าทางแสดงอารมณ์"}, {"id": "E20", "chapter": 2, "q": "ตัวละครที่ใช้ฝึกภาษาท่าตามบทเรียนมีกี่ประเภท?", "opts": ["4 ประเภท", "2 ประเภท", "3 ประเภท", "5 ประเภท"], "explain": "มี 4 ประเภท ได้แก่ พระ นาง ยักษ์ ลิง"}, {"id": "E21", "chapter": 3, "q": "ละครไทยเรื่องแรกสันนิษฐานว่าคือเรื่องใด?", "opts": ["มโนห์รา", "รามเกียรติ์", "อิเหนา", "อุณรุท"], "explain": "หลักฐานทางประวัติศาสตร์สันนิษฐานว่าละครเรื่องแรกของไทยคือเรื่องมโนห์รา"}, {"id": "E22", "chapter": 3, "q": "องค์ประกอบของละครมีกี่ประการ?", "opts": ["4 ประการ", "3 ประการ", "5 ประการ", "6 ประการ"], "explain": "องค์ประกอบของละครมี 4 อย่าง คือ เรื่อง เนื้อหาสรุป นิสัยตัวละคร และบรรยากาศ"}, {"id": "E23", "chapter": 3, "q": "ละครไทยแบ่งออกเป็น 2 ประเภทใหญ่ตามที่บทเรียนระบุคือข้อใด?", "opts": ["ละครรำ กับ ละครที่ไม่ใช้ท่ารำ", "ละครเก่า กับ ละครใหม่", "ละครไทย กับ ละครสากล", "ละครสั้น กับ ละครยาว"], "explain": "จำแนกออกเป็นละครรำและละครที่ไม่ใช้ท่ารำ"}, {"id": "E24", "chapter": 3, "q": "ละครรำแบบดั้งเดิมของไทยมี 3 ประเภทคือข้อใด?", "opts": ["ละครชาตรี ละครนอก ละครใน", "ละครพันทาง เสภา ดึกดำบรรพ์", "ละครร้อง พูด เพลง", "ละครเวที วิทยุ โทรทัศน์"], "explain": "ละครรำแบบแผนดั้งเดิมมี 3 ประเภท คือ ชาตรี นอก และใน"}, {"id": "E25", "chapter": 3, "q": "ละครที่แสดงในราชสำนัก ใช้นักแสดงหญิงล้วน เรียกว่าอะไร?", "opts": ["ละครใน", "ละครนอก", "ละครชาตรี", "ละครพันทาง"], "explain": "ละครในเป็นนาฏศิลป์ชั้นสูงในราชสำนัก ใช้นักแสดงหญิงล้วน"}, {"id": "E26", "chapter": 3, "q": "เครื่องดนตรีพิเศษที่ใช้ประกอบละครเสภาคือข้อใด?", "opts": ["กรับเสภา", "ระนาด", "ซอ", "ขลุ่ย"], "explain": "ละครเสภาใช้กรับเสภาเป็นเครื่องประกอบจังหวะพิเศษ"}, {"id": "E27", "chapter": 3, "q": "ละครพูดเกิดขึ้นในรัชสมัยใด?", "opts": ["รัชกาลที่ 6", "รัชกาลที่ 4", "รัชกาลที่ 5", "รัชกาลที่ 7"], "explain": "พระบาทสมเด็จพระมงกุฎเกล้าเจ้าอยู่หัว (รัชกาลที่ 6) ทรงเป็นผู้ริเริ่มละครพูด"}, {"id": "E28", "chapter": 3, "q": "สถานีโทรทัศน์แห่งแรกของประเทศไทยคือสถานีใด?", "opts": ["สถานีช่อง 4 บางขุนพรหม", "ช่อง 7 สีทีวี", "ช่อง 3", "ช่อง 9 อสมท."], "explain": "ประเทศไทยมีสถานีโทรทัศน์แห่งแรก คือ สถานีช่อง 4 บางขุนพรหม"}, {"id": "E29", "chapter": 3, "q": "ละครวิทยุเกิดขึ้นเป็นครั้งแรกที่ประเทศใด?", "opts": ["สหรัฐอเมริกา", "อังกฤษ", "ไทย", "ฝรั่งเศส"], "explain": "ละครวิทยุกำเนิดครั้งแรกในประเทศสหรัฐอเมริกา ก่อนละครโทรทัศน์และภาพยนตร์"}, {"id": "E30", "chapter": 3, "q": "ในสมัยกรีก-โรมัน ละครถูกจัดแสดงขึ้นเพื่อบูชาเทพเจ้าองค์ใด?", "opts": ["ไดโอนีซุส", "ซุส", "เอเธนา", "อพอลโล"], "explain": "ชาวกรีกจัดแสดงละครเพื่อบูชาเทพเจ้าไดโอนีซุส"}, {"id": "E31", "chapter": 4, "q": "ผู้ทำหน้าที่กำหนดนโยบายและรูปแบบการแสดงเรียกว่าอะไร?", "opts": ["ผู้อำนวยการแสดง (Producer)", "ผู้กำกับการแสดง (Director)", "ผู้กำกับเวที (Stage Manager)", "ผู้เขียนบท (Playwright)"], "explain": "ผู้อำนวยการแสดงหรือ Producer ทำหน้าที่กำหนดนโยบาย รูปแบบ และดูแลงบประมาณ"}, {"id": "E32", "chapter": 4, "q": "ผู้เขียนบทละคร ภาษาอังกฤษเรียกว่าอะไร?", "opts": ["Playwright", "Director", "Producer", "Actor"], "explain": "ผู้เขียนบทละครเรียกว่า Playwright"}, {"id": "E33", "chapter": 4, "q": "ผู้รับผิดชอบดูแลความเรียบร้อยของเวทีและสั่งเริ่ม/หยุดการแสดงคือใคร?", "opts": ["ผู้กำกับเวที (Stage Manager)", "ผู้อำนวยการแสดง", "ผู้จัดการฝ่ายธุรการ", "นักแสดง"], "explain": "ผู้กำกับเวทีเป็นผู้เดียวที่มีสิทธิ์สั่งเริ่ม/หยุดการแสดงบนเวที"}, {"id": "E34", "chapter": 4, "q": "แนวทางการจัดการแสดงละครขั้นตอนแรกคือข้อใด?", "opts": ["พิจารณาบทละคร", "คัดเลือกนักแสดง", "จัดฉาก", "ประเมินผล"], "explain": "ขั้นตอนแรกคือการพิจารณาบทละครก่อนดำเนินการขั้นต่อไป"}, {"id": "E35", "chapter": 4, "q": "การแสดงที่ไม่ใช้คำพูด สื่อสารด้วยท่าทางล้วนๆ เรียกว่าอะไร?", "opts": ["ละครใบ้ (Pantomime)", "ละครพูด", "ละครร้อง", "ละครเวที"], "explain": "การแสดงด้วยท่าทางล้วนโดยไม่มีบทพูดเรียกว่าละครใบ้หรือ Pantomime"}, {"id": "E36", "chapter": 4, "q": "“ละครสด” มีลักษณะอย่างไร?", "opts": ["นักแสดงไม่ได้เตรียมฝึกซ้อมมาก่อน", "ฝึกซ้อมมาอย่างละเอียด", "ใช้บทเตรียมไว้ล่วงหน้าเท่านั้น", "ไม่มีผู้ชม"], "explain": "ละครสดคือละครที่นักแสดงคิดสถานการณ์และแก้ปัญหาเฉพาะหน้าโดยไม่ได้เตรียมบทมาก่อน"}, {"id": "E37", "chapter": 4, "q": "ขั้นตอนสุดท้ายของแนวทางการจัดการแสดงคือข้อใด?", "opts": ["ประเมินผล", "ฝึกซ้อม", "จัดฉาก", "คัดเลือกนักแสดง"], "explain": "การประเมินผลเป็นขั้นตอนสุดท้ายเพื่อสรุปและปรับปรุงการแสดงครั้งต่อไป"}, {"id": "E38", "chapter": 4, "q": "“บทบาทสมมติ” นักแสดงต้องมีคุณสมบัติใด?", "opts": ["เชื่อว่าบทบาทที่ตนสวมอยู่เป็นเรื่องจริง", "ไม่ต้องเชื่อในบทบาทที่แสดง", "ต้องใช้หน้ากากเสมอ", "ต้องร้องเพลงเท่านั้น"], "explain": "นักแสดงบทบาทสมมติต้องมีความเชื่อว่าตนกำลังอยู่ในเหตุการณ์จริง"}, {"id": "E39", "chapter": 4, "q": "ใครมีหน้าที่ดูแลจัดการธุรกิจของโรงละครและจำหน่ายบัตร?", "opts": ["ผู้จัดการฝ่ายธุรการ (House Manager)", "ผู้กำกับการแสดง", "ผู้เขียนบท", "นักแสดง"], "explain": "ผู้จัดการฝ่ายธุรการดูแลธุรกิจโรงละครและการจำหน่ายบัตรเข้าชม"}, {"id": "E40", "chapter": 4, "q": "บทละครที่ใช้ฝึกหัดเบื้องต้นควรมีความยาวประมาณเท่าใด?", "opts": ["20-30 นาที", "5-10 นาที", "1 ชั่วโมง", "2 ชั่วโมง"], "explain": "บทละครสำหรับฝึกหัดทักษะควรเป็นเรื่องสั้นๆ ใช้เวลาแสดงประมาณ 20-30 นาที"}], "medium": [{"id": "M1", "chapter": 1, "q": "ข้อใดจัดอยู่ในกลุ่ม “รำ” ไม่ใช่ “ระบำ”?", "opts": ["รำฉุยฉาย", "ระบำเทพบันเทิง", "ระบำนกสามหมู่", "ระบำโบราณคดี"], "explain": "รำเน้นลีลาเดี่ยว/คู่ที่งดงาม เช่น รำฉุยฉาย ต่างจากระบำที่ร่ายรำพร้อมกันเป็นหมู่"}, {"id": "M2", "chapter": 1, "q": "เหตุใดจึงกล่าวว่านาฏศิลป์ไทยได้รับอิทธิพลจากอินเดีย?", "opts": ["เพราะคติความเชื่อเรื่องพระอิศวรผู้เป็นนาฏราชา", "เพราะใช้ภาษาไทยในการแสดง", "เพราะใช้เครื่องดนตรีสากล", "เพราะไม่มีการแต่งกาย"], "explain": "ความเชื่อเรื่องพระอิศวรเป็นนาฏราชาที่ประทานท่ารำเป็นที่มาสำคัญของอิทธิพลอินเดีย"}, {"id": "M3", "chapter": 1, "q": "หากขาดองค์ประกอบข้อใด จะทำให้ผู้ชมไม่เข้าใจอารมณ์ของเรื่องที่แสดง?", "opts": ["เนื้อร้องและทำนองเพลง", "เครื่องแต่งกาย", "อุปกรณ์ประกอบฉาก", "แสงไฟ"], "explain": "เนื้อร้องและทำนองเพลงทำหน้าที่สื่อความหมายและถ่ายทอดอารมณ์ของการแสดง"}, {"id": "M4", "chapter": 1, "q": "“โขน” ต่างจาก “ละคร” อย่างชัดเจนในด้านใด?", "opts": ["โขนใช้ผู้พากย์/เจรจาแทนนักแสดง", "โขนไม่มีดนตรีประกอบ", "ละครไม่มีนักแสดง", "ละครไม่มีเรื่องราว"], "explain": "จุดต่างสำคัญคือโขนไม่ได้พูดหรือร้องเอง แต่มีผู้พากย์และเจรจาแทน"}, {"id": "M5", "chapter": 1, "q": "การที่รัชกาลที่ 4 พระราชทานพระบรมราชานุญาตให้เจ้านายฝึกละครหญิงได้ ส่งผลอย่างไร?", "opts": ["ทำให้ละครที่แสดงโดยผู้หญิงได้รับความนิยมมากขึ้น", "ทำให้ละครเลิกแสดงไปทั้งหมด", "ทำให้ยกเลิกการแสดงโขน", "ไม่มีผลใดๆ ต่อวงการละคร"], "explain": "หลังได้รับพระบรมราชานุญาต ละครที่แสดงโดยผู้หญิงได้รับความนิยมมากขึ้นในสังคม"}, {"id": "M6", "chapter": 1, "q": "จอมพล ป. พิบูลสงคราม มีบทบาทต่อนาฏศิลป์ไทยอย่างไร?", "opts": ["สร้างค่านิยมรักชาติผ่านการแสดงและปรับปรุงรำวงมาตรฐาน", "ยกเลิกการแสดงนาฏศิลป์ทั้งหมด", "นำนาฏศิลป์ไทยไปแสดงต่างประเทศเท่านั้น", "ห้ามใช้เครื่องดนตรีไทย"], "explain": "จอมพล ป. พิบูลสงคราม ส่งเสริมค่านิยมรักชาติผ่านการแสดง และมอบหมายให้กรมศิลปากรปรับปรุงรำโทนเป็นรำวงมาตรฐาน"}, {"id": "M7", "chapter": 1, "q": "“เซิ้งกระติบข้าว” สะท้อนวิถีชีวิตด้านใดของคนอีสาน?", "opts": ["การประกอบอาชีพและการรับประทานข้าวเหนียว", "การประมงทางทะเล", "การทำสวนผลไม้", "การเลี้ยงช้าง"], "explain": "เซิ้งกระติบข้าวสะท้อนวิถีชีวิตชาวนาอีสานที่นำข้าวเหนียวใส่กระติบไปส่งให้ผู้ทำงาน"}, {"id": "M8", "chapter": 1, "q": "ข้อใดกล่าวถูกต้องเกี่ยวกับการเปลี่ยนแปลงของนาฏศิลป์ไทยตามยุคสมัย?", "opts": ["นาฏศิลป์ไทยปรับตัวผสมผสานกับนาฏศิลป์ตะวันตกจนเกิดนาฏศิลป์ร่วมสมัย", "นาฏศิลป์ไทยไม่เคยเปลี่ยนแปลงเลย", "นาฏศิลป์ไทยถูกยกเลิกไปแล้วในปัจจุบัน", "ยุคสมัยไม่มีผลต่อนาฏศิลป์เลย"], "explain": "ยุคสมัยที่เปลี่ยนแปลงทำให้เกิดการผสมผสานจนเป็นนาฏศิลป์ร่วมสมัย"}, {"id": "M9", "chapter": 1, "q": "ข้อใดคือความแตกต่างหลักระหว่าง “ฟ้อน” กับ “รำ”?", "opts": ["ฟ้อนเป็นศิลปะการร่ายรำเฉพาะถิ่น ส่วนรำเป็นแบบมาตรฐานของราชสำนัก", "ฟ้อนใช้แต่ผู้ชาย รำใช้แต่ผู้หญิง", "ฟ้อนไม่มีดนตรีประกอบ", "รำไม่มีท่าทางกำหนดไว้"], "explain": "ฟ้อนเป็นศิลปะพื้นถิ่นภาคเหนือ-อีสาน ส่วนรำมักเป็นแบบแผนที่สืบทอดจากราชสำนัก"}, {"id": "M10", "chapter": 1, "q": "เหตุใดพ.ร.บ. วัฒนธรรม พ.ศ. 2485 จึงส่งผลให้การแสดงบางประเภทหายไปจากสังคมไทย?", "opts": ["เพราะกำหนดประเภทละครไว้เพียง 14 ประเภท ละครนอกเหนือจากนั้นต้องเลิกแสดง", "เพราะห้ามผู้หญิงแสดงละคร", "เพราะยกเลิกโรงละครทั้งหมด", "เพราะไม่มีงบประมาณสนับสนุน"], "explain": "พ.ร.บ. ดังกล่าวจำกัดประเภทละครที่ได้รับอนุญาตไว้เพียง 14 ประเภท ทำให้การแสดงบางประเภทค่อยๆ เลือนหายไป"}, {"id": "M11", "chapter": 2, "q": "เหตุใดผู้เรียนนาฏศิลป์ไทยจึงต้องนุ่งโจงกระเบนในการฝึกร่ายรำ?", "opts": ["เพื่ออนุรักษ์การแต่งกายและช่วยให้เห็นทรวดทรง จับท่ารำได้ชัดเจน", "เพราะกฎหมายบังคับให้แต่งกายเช่นนั้น", "เพราะราคาถูกกว่าชุดอื่น", "เพื่อความสะดวกในการเคลื่อนที่เท่านั้น"], "explain": "การนุ่งโจงกระเบนช่วยอนุรักษ์การแต่งกายแบบไทยและทำให้ผู้สอนเห็นทรวดทรงเพื่อแก้ไขท่ารำได้ง่าย"}, {"id": "M12", "chapter": 2, "q": "การยกเท้าแบบพระกับแบบนางแตกต่างกันอย่างไร?", "opts": ["พระกันเข่าออกด้านข้าง นางยกเท้าไปข้างหน้าแบบหนีบขา", "พระกับนางยกเท้าเหมือนกันทุกประการ", "นางไม่ยกเท้าเลย", "พระไม่ยกเท้าเลย"], "explain": "การยกเท้าแบบพระคือกันเข่าออกด้านข้าง ส่วนแบบนางคือยกไปข้างหน้าในลักษณะหนีบขา"}, {"id": "M13", "chapter": 2, "q": "“ท่าเรียก” กับ “ท่ารัก” ต่างกันในเชิงหน้าที่การสื่อสารอย่างไร?", "opts": ["ท่าเรียกใช้แทนคำพูด ส่วนท่ารักใช้แสดงอารมณ์ภายใน", "ทั้งสองใช้แทนคำพูดเหมือนกัน", "ทั้งสองใช้แสดงอารมณ์เหมือนกัน", "ไม่มีความแตกต่างกันเลย"], "explain": "ท่าเรียกจัดอยู่ในกลุ่มท่าทางที่ใช้แทนคำพูด ส่วนท่ารักจัดอยู่ในกลุ่มท่าทางที่แสดงอารมณ์และความรู้สึกภายใน"}, {"id": "M14", "chapter": 2, "q": "รำวงมาตรฐานเกิดขึ้นในบริบททางประวัติศาสตร์ใด?", "opts": ["ช่วงสงครามโลกครั้งที่ 2 เพื่อปรับปรุงรำโทนให้มีแบบแผน", "สมัยสุโขทัย", "สมัยรัชกาลที่ 9", "หลัง พ.ศ. 2540"], "explain": "ในช่วงสงครามโลกครั้งที่ 2 จอมพล ป. พิบูลสงครามให้กรมศิลปากรปรับปรุงรำโทนให้เป็นรำวงมาตรฐาน"}, {"id": "M15", "chapter": 2, "q": "ข้อใดคือลำดับขั้นตอนของ “การประเท้า” ที่ถูกต้อง?", "opts": ["ยกจมูกเท้าขึ้น ย่อเข่าลง แล้วตบจมูกเท้าลง", "กระโดดขึ้นแล้วลงเท่านั้น", "ยืนนิ่งไม่เคลื่อนไหว", "หมุนตัวรอบเดียว"], "explain": "การประเท้าปฏิบัติโดยยกจมูกเท้าขึ้น ย่อเข่าลง แล้วตบจมูกเท้าลงในลักษณะที่กำหนด"}, {"id": "M16", "chapter": 2, "q": "เหตุใด “รองเง็ง” จึงมีกลิ่นอายวัฒนธรรมมลายู?", "opts": ["เพราะเดิมเป็นการแสดงในราชสำนักมาเลเซียก่อนแพร่เข้าสู่ภาคใต้ของไทย", "เพราะแต่งกายแบบไทย-จีน", "เพราะไม่มีดนตรีประกอบ", "เพราะเล่นในภาคเหนือของไทย"], "explain": "รองเง็งมีต้นกำเนิดจากราชสำนักมาเลเซียก่อนแพร่หลายมาสู่ภาคใต้ของไทย"}, {"id": "M17", "chapter": 2, "q": "เหตุใดเพลงที่ใช้ประกอบการเต้นรองเง็งจึงไม่นิยมใส่เนื้อร้อง?", "opts": ["เพราะจังหวะเร็วและมีลีลากลมกลืนไปกับดนตรีพื้นบ้าน", "เพราะห้ามร้องเพลงมลายู", "เพราะไม่มีนักร้องในพื้นที่", "เพราะเป็นการแสดงใบ้"], "explain": "ด้วยจังหวะที่ค่อนข้างเร็วและลีลากลมกลืนกับดนตรี เพลงรองเง็งจึงไม่นิยมใส่เนื้อร้อง"}, {"id": "M18", "chapter": 2, "q": "ระบำมาตรฐานชุด “ระบำกฤดาภินิหาร” มีความเกี่ยวข้องกับเรื่องใด?", "opts": ["เกียรติศักดิ์ไทย", "รามเกียรติ์", "อิเหนา", "มโนห์รา"], "explain": "ระบำกฤดาภินิหารจัดแสดงประกอบละครเรื่อง “เกียรติศักดิ์ไทย”"}, {"id": "M19", "chapter": 2, "q": "ข้อใดคือความเหมือนกันระหว่างการฝึก “นาฏยศัพท์” และ “การตีบท”?", "opts": ["ทั้งสองใช้ภาษาท่าเพื่อสื่อความหมาย", "ทั้งสองไม่เกี่ยวข้องกับร่างกาย", "ทั้งสองใช้เฉพาะกับโขนเท่านั้น", "ทั้งสองไม่มีแบบแผนกำหนดไว้"], "explain": "ทั้งนาฏยศัพท์และการตีบทต่างใช้ภาษาท่าทางในการสื่อความหมาย เพียงแต่การตีบทนำไปปรับใช้กับบทละครจริง"}, {"id": "M20", "chapter": 2, "q": "เหตุใดการฝึกภาษาท่าจึงต้องแยกฝึกสำหรับตัวละคร 4 ประเภท (พระ นาง ยักษ์ ลิง)?", "opts": ["เพราะแต่ละตัวละครมีลีลาการแสดงท่าทางที่มีเอกลักษณ์เฉพาะแตกต่างกัน", "เพราะกฎหมายกำหนดไว้", "เพราะสีเสื้อของแต่ละตัวต่างกัน", "เพราะใช้เครื่องดนตรีคนละชนิด"], "explain": "ตัวละครแต่ละประเภทมีบุคลิกและลีลาเฉพาะตัว การฝึกจึงต้องแยกตามลักษณะเพื่อความสมจริง"}, {"id": "M21", "chapter": 3, "q": "ข้อใดสะท้อนความแตกต่างสำคัญระหว่าง “ละครใน” และ “ละครนอก”?", "opts": ["ละครในใช้นักแสดงหญิงล้วนและดำเนินเรื่องอย่างประณีต ส่วนละครนอกใช้นักแสดงชายล้วนดำเนินเรื่องรวดเร็ว", "ทั้งสองใช้นักแสดงชายล้วนเหมือนกัน", "ละครในไม่มีดนตรีประกอบ", "ละครนอกแสดงเฉพาะในวังเท่านั้น"], "explain": "ละครในเป็นนาฏศิลป์ชั้นสูงในราชสำนักใช้นักแสดงหญิงล้วน ส่วนละครนอกแสดงนอกเขตพระราชฐานใช้นักแสดงชายล้วนและดำเนินเรื่องรวดเร็ว"}, {"id": "M22", "chapter": 3, "q": "เหตุใดละครดึกดำบรรพ์จึงกำหนดให้นักแสดงต้องร้องเองรำเอง?", "opts": ["เพราะยึดแนวละครโอเปราตะวันตกที่เน้นความสมจริงของนักแสดง", "เพราะขาดแคลนนักร้องในสมัยนั้น", "เพราะห้ามใช้ดนตรีประกอบ", "เพราะเป็นข้อกำหนดทางศาสนา"], "explain": "ละครดึกดำบรรพ์ปรับปรุงตามแบบโอเปราตะวันตกที่ให้นักแสดงร้องและรำเอง เพื่อความสมจริง"}, {"id": "M23", "chapter": 3, "q": "การกำเนิดของ “ละครพูด” ในรัชกาลที่ 6 สะท้อนอิทธิพลจากที่ใด?", "opts": ["การรับรูปแบบละครตะวันตกที่เน้นบทสนทนาแทนการร่ายรำ", "วัฒนธรรมจีน", "ศาสนาพราหมณ์", "นาฏศิลป์อินเดียโบราณ"], "explain": "ละครพูดได้รับอิทธิพลจากละครตะวันตกที่เน้นบทสนทนาเป็นหลักแทนการร่ายรำ"}, {"id": "M24", "chapter": 3, "q": "เหตุใดจึงกล่าวว่า “ละครเวที” เกิดขึ้นเพื่อทดแทนภาพยนตร์ในช่วงสงครามโลกครั้งที่ 2?", "opts": ["เพราะภาพยนตร์ขาดแคลนผู้ผลิตในช่วงสงคราม", "เพราะภาพยนตร์ถูกห้ามฉายโดยกฎหมาย", "เพราะภาพยนตร์มีราคาแพงเกินไป", "เพราะไม่มีโรงภาพยนตร์ในประเทศไทย"], "explain": "ในช่วงสงครามโลกครั้งที่ 2 การผลิตภาพยนตร์ขาดแคลน ละครเวทีจึงเกิดขึ้นเพื่อเป็นสิ่งบันเทิงทดแทน"}, {"id": "M25", "chapter": 3, "q": "องค์ประกอบ “นิสัยตัวละคร (Characterization)” มีความสำคัญอย่างไรต่อบทละคร?", "opts": ["กำหนดให้ผู้ประพันธ์บทสร้างตัวละครให้มีบุคลิกลักษณะตรงกับเนื้อเรื่อง", "ไม่มีผลต่อเนื้อเรื่องเลย", "เกี่ยวข้องกับการจัดฉากเท่านั้น", "เกี่ยวข้องกับราคาบัตรเข้าชม"], "explain": "นิสัยตัวละครเป็นองค์ประกอบสำคัญที่ผู้ประพันธ์ต้องสร้างให้สอดคล้องกับโครงเรื่องและเหตุการณ์"}, {"id": "M26", "chapter": 3, "q": "เพราะเหตุใดละครวิทยุจึงต้องอาศัยเสียงประกอบที่หลากหลายเป็นพิเศษ?", "opts": ["เพราะผู้ฟังไม่เห็นภาพ ต้องใช้เสียงกระตุ้นจินตนาการแทน", "เพราะไม่มีนักแสดงจริง", "เพราะออกอากาศเฉพาะกลางคืน", "เพราะกฎหมายกำหนดไว้"], "explain": "เนื่องจากผู้ฟังไม่เห็นภาพ เสียงประกอบจึงมีบทบาทสำคัญในการสร้างจินตนาการแทนสายตา"}, {"id": "M27", "chapter": 3, "q": "ข้อใดคือลำดับพัฒนาการของละครไทยตามยุคสมัยที่ถูกต้อง?", "opts": ["ละครชาตรี → ละครใน/นอก → ละครดึกดำบรรพ์/พันทาง/เสภา → ละครร้อง/พูด/เวที/วิทยุ/โทรทัศน์", "ละครโทรทัศน์ → ละครชาตรี → ละครใน", "ละครพูด → ละครชาตรี → ละครนอก", "ไม่มีลำดับพัฒนาการที่แน่นอน"], "explain": "ละครไทยพัฒนาจากละครรำแบบดั้งเดิม สู่ละครรำที่ปรับปรุงใหม่ และสู่ละครที่ไม่ใช้ท่ารำในยุคหลัง"}, {"id": "M28", "chapter": 3, "q": "เหตุใดละครสมัยอียิปต์และกรีก-โรมันจึงมีความเกี่ยวข้องกับศาสนา?", "opts": ["เพราะจุดกำเนิดของละครทุกชาติเริ่มจากพิธีกรรมทางศาสนา", "เพราะนักแสดงเป็นนักบวชเท่านั้น", "เพราะไม่มีผู้ชมทั่วไป", "เพราะการแสดงเกิดขึ้นในวัดเท่านั้น"], "explain": "ต้นกำเนิดของละครทุกชาติทุกภาษามักเริ่มจากพิธีกรรมทางศาสนาที่มีแบบแผนสืบทอดกันมา"}, {"id": "M29", "chapter": 3, "q": "หากต้องเลือกชมละครที่เน้น “การขับร้องเป็นหลักและมีลูกคู่ร้องรับ” ควรเลือกชมประเภทใด?", "opts": ["ละครเพลง", "ละครพูด", "ละครใบ้", "ละครใน"], "explain": "ละครเพลงเน้นการขับร้องเป็นหลักโดยมีลูกคู่ร้องรับตามแบบฉบับ"}, {"id": "M30", "chapter": 3, "q": "เหตุใดการรับชมละครโทรทัศน์จึงต้องใช้วิจารณญาณเป็นพิเศษตามที่บทเรียนแนะนำ?", "opts": ["เพราะบางเรื่องอาจมีตัวอย่างพฤติกรรมที่ไม่เหมาะสม ผู้ชมต้องแยกแยะระหว่างเรื่องแต่งกับชีวิตจริง", "เพราะราคาสมาชิกแพง", "เพราะมีเวลาจำกัดในการรับชม", "เพราะต้องใช้ภาษาอังกฤษ"], "explain": "บทเรียนแนะนำให้ใช้วิจารณญาณเพราะละครบางเรื่องอาจมีตัวอย่างพฤติกรรมที่ไม่เหมาะสมกับชีวิตจริง"}, {"id": "M31", "chapter": 4, "q": "เหตุใดผู้กำกับเวที (Stage Manager) จึงต้องเป็นผู้เดียวที่สั่งเริ่ม/หยุดการแสดง?", "opts": ["เพื่อความเป็นระเบียบและปลอดภัยในการควบคุมองค์ประกอบทุกฝ่ายบนเวที", "เพราะเป็นผู้เขียนบทละคร", "เพราะเป็นนักแสดงนำของเรื่อง", "ไม่มีเหตุผลพิเศษใดๆ"], "explain": "การให้ผู้กำกับเวทีเป็นผู้เดียวที่สั่งการช่วยให้การแสดงเป็นระเบียบและปลอดภัย"}, {"id": "M32", "chapter": 4, "q": "เพราะเหตุใดขั้นตอน “พิจารณาบทละคร” จึงต้องมาก่อนการคัดเลือกนักแสดง?", "opts": ["เพราะบทละครกำหนดแนวคิดและลักษณะตัวละครที่ต้องใช้คัดเลือกนักแสดงให้เหมาะสม", "เพราะกฎหมายกำหนดลำดับขั้นตอน", "เพราะนักแสดงต้องเขียนบทเอง", "ไม่มีความเกี่ยวข้องกันเลย"], "explain": "ต้องรู้เนื้อหาและลักษณะตัวละครจากบทก่อน จึงจะคัดเลือกนักแสดงที่เหมาะสมได้"}, {"id": "M33", "chapter": 4, "q": "เหตุใดนักแสดงละครใบ้ (Pantomime) จึงต้องแสดงท่าทางให้ชัดเจนเป็นพิเศษ?", "opts": ["เพราะไม่มีบทพูดช่วยสื่อความหมาย ต้องอาศัยท่าทางสื่อสารทั้งหมด", "เพราะไม่มีผู้ชมเข้าร่วมชม", "เพราะแสดงในที่มืดตลอดเวลา", "เพราะไม่มีดนตรีประกอบ"], "explain": "เนื่องจากไม่มีคำพูด ท่าทางจึงเป็นเครื่องมือสื่อสารเดียวที่ต้องชัดเจนที่สุด"}, {"id": "M34", "chapter": 4, "q": "เหตุใดละครสดจึงช่วยฝึกทักษะ “ปฏิภาณไหวพริบ” ให้นักแสดง?", "opts": ["เพราะนักแสดงต้องแก้ปัญหาเฉพาะหน้าโดยไม่มีบทเตรียมไว้ล่วงหน้า", "เพราะมีเวลาซ้อมนานมาก", "เพราะมีบทพูดตายตัวทุกครั้ง", "เพราะไม่มีผู้ชมจริง"], "explain": "การไม่มีบทเตรียมไว้ล่วงหน้าบังคับให้นักแสดงต้องคิดและตอบสนองอย่างฉับไว"}, {"id": "M35", "chapter": 4, "q": "ข้อใดคือเหตุผลที่การประเมินผลควรมีเกณฑ์ชัดเจนและเข้าใจง่าย?", "opts": ["เพื่อให้นักแสดงพร้อมรับฟังคำวิจารณ์และนำไปปรับปรุงการแสดงครั้งต่อไป", "เพื่อให้ผู้ชมสับสน", "เพื่อลดเวลาการแสดง", "ไม่มีความจำเป็นต้องมีเกณฑ์"], "explain": "เกณฑ์ที่ชัดเจนช่วยให้นักแสดงเข้าใจจุดที่ต้องปรับปรุงและมีความมั่นใจมากขึ้น"}, {"id": "M36", "chapter": 4, "q": "หากขาดเจ้าหน้าที่เครื่องแต่งกายและแต่งหน้า (Costume & Make up) จะเกิดผลกระทบใด?", "opts": ["นักแสดงไม่สามารถถ่ายทอดลักษณะตัวละครได้สมจริง", "ไม่มีผลกระทบใดๆ ต่อการแสดง", "บทละครจะเปลี่ยนแปลงไปทันที", "เวทีการแสดงจะพังทลาย"], "explain": "เครื่องแต่งกายและการแต่งหน้าช่วยบ่งบอกลักษณะและบทบาทของตัวละครให้สมจริง"}, {"id": "M37", "chapter": 4, "q": "เพราะเหตุใดผู้อำนวยการแสดง (Producer) จึงต้องมีอำนาจตัดสินใจเรื่องงบประมาณ?", "opts": ["เพราะเป็นผู้กำหนดนโยบายและรูปแบบการแสดงในภาพรวมทั้งหมด", "เพราะเป็นนักแสดงนำของเรื่อง", "เพราะเป็นผู้ขายบัตรเข้าชม", "ไม่มีเหตุผลที่ชัดเจน"], "explain": "ในฐานะผู้กำหนดนโยบายภาพรวม ผู้อำนวยการแสดงจึงต้องดูแลและตัดสินใจเรื่องงบประมาณด้วย"}, {"id": "M38", "chapter": 4, "q": "สถานการณ์ “ตลาด” ที่ใช้ฝึกละครสดฝึกทักษะด้านใดเป็นพิเศษ?", "opts": ["การแสดงบทบาทสมมติเป็นผู้ซื้อ-ผู้ขายและการโต้ตอบเฉพาะหน้า", "การร้องเพลงประกอบละคร", "การเต้นรำแบบมาตรฐาน", "การแต่งหน้าตัวละคร"], "explain": "สถานการณ์ตลาดฝึกให้นักแสดงสวมบทบาทผู้ซื้อ-ผู้ขายและโต้ตอบสถานการณ์เฉพาะหน้า"}, {"id": "M39", "chapter": 4, "q": "เหตุใดบทบาทสมมติจึงต้องอาศัย “ประสาทสัมผัสทั้งห้า” ของนักแสดง?", "opts": ["เพื่อให้นักแสดงตอบสนองต่อสถานการณ์สมมติได้สมจริงเสมือนเหตุการณ์จริง", "เพราะกฎการแสดงกำหนดไว้ตายตัว", "เพราะไม่มีอุปกรณ์ประกอบฉาก", "เพราะไม่มีผู้ชมเข้าร่วม"], "explain": "การใช้ประสาทสัมผัสทั้งห้าช่วยให้นักแสดงตอบสนองต่อสถานการณ์สมมติได้อย่างสมจริง"}, {"id": "M40", "chapter": 4, "q": "เพราะเหตุใดการฝึกละครควรเริ่มจาก “เรื่องสั้นๆ มีตัวละคร 2-3 ตัว”?", "opts": ["เพื่อฝึกทักษะการแสดงให้ชำนาญก่อนขยายไปสู่การแสดงที่ซับซ้อนขึ้น", "เพราะไม่มีนักแสดงเพียงพอ", "เพราะกฎหมายกำหนดไว้", "เพราะประหยัดงบประมาณมากที่สุด"], "explain": "การเริ่มจากเรื่องสั้นและตัวละครน้อยช่วยให้ฝึกทักษะพื้นฐานได้ชำนาญก่อนขยายความซับซ้อน"}], "hard": [{"id": "H1", "chapter": 1, "q": "ตามพจนานุกรมฉบับราชบัณฑิตยสถาน นาฏศิลป์มีนิยามย่อยกี่ความหมายตามที่ระบุในบทเรียน?", "opts": ["5 ความหมาย", "3 ความหมาย", "4 ความหมาย", "6 ความหมาย"], "explain": "นิยามย่อย 5 ความหมาย ได้แก่ ความชำนาญ ศิลปะการละคร การร้องรำทำเพลง การฟ้อนรำ และศิลปะการฟ้อนรำ"}, {"id": "H2", "chapter": 1, "q": "องค์ประกอบของนาฏศิลป์ไทยตามที่ระบุในบทเรียนมีทั้งหมดกี่ข้อ?", "opts": ["7 ข้อ", "5 ข้อ", "6 ข้อ", "8 ข้อ"], "explain": "องค์ประกอบมี 7 ข้อ คือ การฟ้อนรำ จังหวะ เนื้อร้อง/ทำนอง อุปกรณ์ประกอบ เครื่องดนตรี การแต่งหน้า และการแต่งกาย"}, {"id": "H3", "chapter": 1, "q": "ประเภทของนาฏศิลป์ไทยตามที่จัดแบ่งในบทเรียนมีกี่ประเภท?", "opts": ["6 ประเภท", "4 ประเภท", "5 ประเภท", "7 ประเภท"], "explain": "แบ่งเป็น 6 ประเภท คือ ระบำ รำ ฟ้อน โขน ละคร และการแสดงพื้นบ้าน"}, {"id": "H4", "chapter": 1, "q": "ข้อใดคือตัวอย่างของ “รำ” ที่ระบุไว้ในบทเรียนทั้งหมด?", "opts": ["รำสีนวล รำฉุยฉาย รำหนุมานจับนางสุพรรณมัจฉา รำหนุมานจับนางเบญกาย", "ฟ้อนเล็บ ฟ้อนเทียน", "ระบำเทพบันเทิง ระบำโบราณคดี", "เซิ้งกระติบข้าว เซิ้งสวิง"], "explain": "ตัวอย่างของรำที่ยกไว้ในบทเรียน ได้แก่ รำสีนวล รำฉุยฉาย และรำชุดหนุมานทั้งสองชุด"}, {"id": "H5", "chapter": 1, "q": "ปัจจัยที่มีผลต่อการเปลี่ยนแปลงนาฏศิลป์ไทยตามบทเรียนแบ่งเป็นกี่ข้อ อะไรบ้าง?", "opts": ["4 ข้อ ได้แก่ นโยบายของรัฐ สภาพสังคมและวิถีชีวิต ค่านิยม และยุคสมัยที่เปลี่ยนแปลง", "3 ข้อ", "5 ข้อ", "2 ข้อ"], "explain": "มี 4 ปัจจัยตามที่ระบุในบทเรียน"}, {"id": "H6", "chapter": 1, "q": "ตัวอย่างระบำที่ระบุไว้ในบทเรียนมีชื่อใดบ้าง?", "opts": ["ระบำเทพบันเทิง ระบำโบราณคดี ระบำนกสามหมู่", "ระบำกฤดาภินิหารเท่านั้น", "ระบำเงี้ยว", "ระบำเสภา"], "explain": "ตัวอย่างระบำที่ระบุในบทเรียน ได้แก่ ระบำเทพบันเทิง ระบำโบราณคดี และระบำนกสามหมู่"}, {"id": "H7", "chapter": 1, "q": "พ.ร.บ. วัฒนธรรมที่จำกัดประเภทละครไว้ 14 ประเภท เป็นนโยบายในสมัยรัฐบาลใด?", "opts": ["รัฐบาลจอมพล ป. พิบูลสงคราม", "รัชกาลที่ 5", "รัชกาลที่ 6", "รัฐบาลหลัง พ.ศ. 2500"], "explain": "พ.ร.บ. วัฒนธรรม พ.ศ. 2485 เป็นนโยบายในยุครัฐบาลจอมพล ป. พิบูลสงคราม"}, {"id": "H8", "chapter": 1, "q": "“การแสดงพื้นบ้าน” ของภาคอีสานที่ยกตัวอย่างในบทเรียนมีชื่อใดบ้าง (นอกจากเซิ้งกระติบข้าว)?", "opts": ["เซิ้งสวิง เซิ้งบุญบั้งไฟ", "ฟ้อนเงี้ยว", "รองเง็ง", "รำเหย่อย"], "explain": "บทเรียนยกตัวอย่างการแสดงพื้นบ้านอีสานเพิ่มเติม ได้แก่ เซิ้งสวิงและเซิ้งบุญบั้งไฟ"}, {"id": "H9", "chapter": 1, "q": "ที่มาของนาฏศิลป์ไทยจาก “การเลียนแบบธรรมชาติ” ในบทเรียนหมายถึงข้อใด?", "opts": ["กิริยาท่าทางตามธรรมชาติของมนุษย์ที่บ่งบอกความหมาย นำมาประดิษฐ์เป็นท่ารำ", "การเลียนแบบสัตว์ป่าเท่านั้น", "การเลียนแบบพืชพรรณเท่านั้น", "การเลียนแบบปรากฏการณ์ธรรมชาติเท่านั้น"], "explain": "หมายถึงกิริยาท่าทางตามธรรมชาติของมนุษย์ที่สื่อความหมาย ถูกนำมาประดิษฐ์เป็นท่ารำ"}, {"id": "H10", "chapter": 1, "q": "เหตุใดในสมัยรัชกาลที่ 4 การแสดงของผู้หญิงจึงเริ่มได้รับความนิยมมากขึ้นตามบทเรียน?", "opts": ["เพราะพระราชทานพระบรมราชานุญาตให้เจ้านายฝึกละครให้กับผู้หญิงได้เป็นครั้งแรก", "เพราะยกเลิกละครชายล้วนทั้งหมด", "เพราะนำเข้าครูฝึกจากต่างประเทศ", "เพราะเปลี่ยนกฎหมายแรงงาน"], "explain": "การพระราชทานพระบรมราชานุญาตให้ฝึกละครหญิงเป็นจุดเริ่มต้นความนิยมละครที่แสดงโดยผู้หญิง"}, {"id": "H11", "chapter": 2, "q": "รำวงมาตรฐานเดิมพัฒนามาจากการละเล่นที่เรียกว่าอะไร และเพลงแรกของการละเล่นนั้นชื่อว่าอะไร?", "opts": ["รำโทน / เพลงใกล้เข้าไปอีกนิด", "รำเซิ้ง / เพลงลาวดวงเดือน", "รำฟ้อน / เพลงคืนเดือนหงาย", "รำวง / เพลงงามแสงเดือน"], "explain": "รำโทนเป็นต้นกำเนิดของรำวงมาตรฐาน โดยเพลงแรกของรำโทนคือ “เพลงใกล้เข้าไปอีกนิด”"}, {"id": "H12", "chapter": 2, "q": "กรมศิลปากรประพันธ์เนื้อร้องและทำนองรำวงมาตรฐานชุดแรกจำนวน 4 เพลง ในปี พ.ศ. ใด?", "opts": ["2487", "2484", "2490", "2500"], "explain": "กรมศิลปากรประพันธ์เพลงชุดแรก 4 เพลงในปี พ.ศ. 2487 ตามที่ได้รับมอบหมายในช่วงสงครามโลกครั้งที่ 2"}, {"id": "H13", "chapter": 2, "q": "เพลงชุดแรก 4 เพลงของรำวงมาตรฐานที่กรมศิลปากรประพันธ์ขึ้นได้แก่เพลงใดบ้าง?", "opts": ["งามแสงเดือน ชาวไทย รำซิมารำ คืนเดือนหงาย", "ดวงจันทร์วันเพ็ญ ดอกไม้ของชาติ หญิงไทยใจงาม ยอดชายใจหาญ", "ดวงจันทร์ขวัญฟ้า บูชานักรบเท่านั้น", "ลาวดวงเดือน ลาวจ้อย"], "explain": "ชุดแรกได้แก่ งามแสงเดือน ชาวไทย รำซิมารำ และคืนเดือนหงาย"}, {"id": "H14", "chapter": 2, "q": "เพลงรำวงมาตรฐานที่เพิ่มขึ้นภายหลังอีก 6 เพลงมีชื่อใดบ้าง?", "opts": ["ดวงจันทร์วันเพ็ญ ดอกไม้ของชาติ หญิงไทยใจงาม ดวงจันทร์ขวัญฟ้า ยอดชายใจหาญ บูชานักรบ", "งามแสงเดือน ชาวไทย รำซิมารำ คืนเดือนหงาย", "เพลงเหย่อยเท่านั้น", "เพลงฟ้อนเงี้ยว"], "explain": "เพลงชุดที่เพิ่มเติมภายหลังมี 6 เพลงตามที่ระบุ"}, {"id": "H15", "chapter": 2, "q": "รวมทั้งหมดแล้วรำวงมาตรฐานมีท่ารำมาตรฐานทั้งหมดกี่ท่า?", "opts": ["17 ท่า", "10 ท่า", "15 ท่า", "20 ท่า"], "explain": "รำวงมาตรฐาน 10 เพลง มีท่ารำมาตรฐานรวมทั้งหมด 17 ท่า"}, {"id": "H16", "chapter": 2, "q": "ผู้ประดิษฐ์ท่ารำระบำมาตรฐานชุด “ระบำกฤดาภินิหาร” คือใคร?", "opts": ["นางลมุล ยมะคุปต์ และนางศุภลักษณ์ ภัทรนาวิก", "นางสาวสุดา บุษปฤกษ์เท่านั้น", "ครูมนตรี ตราโมท", "พรานบูรพ์"], "explain": "ผู้ประดิษฐ์ท่ารำคือนางลมุล ยมะคุปต์ และนางศุภลักษณ์ ภัทรนาวิก"}, {"id": "H17", "chapter": 2, "q": "ผู้ประพันธ์บทร้องของระบำกฤดาภินิหารคือใคร?", "opts": ["นางสาวสุดา บุษปฤกษ์", "นางลมุล ยมะคุปต์", "นางศุภลักษณ์ ภัทรนาวิก", "พรานบูรพ์"], "explain": "บทร้องของระบำกฤดาภินิหารประพันธ์โดยนางสาวสุดา บุษปฤกษ์"}, {"id": "H18", "chapter": 2, "q": "ระบำกฤดาภินิหารจัดแสดงประกอบละครเรื่องใดเป็นครั้งแรกในปี พ.ศ. 2486?", "opts": ["เกียรติศักดิ์ไทย", "ราชาธิราช", "รามเกียรติ์", "มโนห์รา"], "explain": "ระบำกฤดาภินิหารจัดแสดงครั้งแรกประกอบละครเรื่อง “เกียรติศักดิ์ไทย” ในปี พ.ศ. 2486"}, {"id": "H19", "chapter": 2, "q": "กรมศิลปากรนำ “รำเหย่อย” ออกเผยแพร่ครั้งแรกในปี พ.ศ. ใด?", "opts": ["2507", "2500", "2515", "2520"], "explain": "กรมศิลปากรนำรำเหย่อยออกเผยแพร่ครั้งแรกในปี พ.ศ. 2507"}, {"id": "H20", "chapter": 2, "q": "ครูผู้นำท่ารำ “ฟ้อนเงี้ยว” มาปรับปรุงและบรรจุในหลักสูตรวิชานาฏศิลป์เมื่อ พ.ศ. 2478 คือใคร?", "opts": ["ครูลมุล ยมะคุปต์", "ครูมนตรี ตราโมท", "ครูศุภลักษณ์ ภัทรนาวิก", "พรานบูรพ์"], "explain": "ครูลมุล ยมะคุปต์ เป็นผู้นำลีลาท่ารำฟ้อนเงี้ยวมาปรับปรุงและบรรจุในหลักสูตรวิชานาฏศิลป์"}, {"id": "H21", "chapter": 3, "q": "ในการแสดงละครชาตรี ตัวละครมีกี่ตัวและมีตัวใดบ้าง?", "opts": ["3 ตัว คือ ตัวนายโรง(ตัวพระ) ตัวนาง และตัวตลก", "2 ตัว", "4 ตัว", "5 ตัว"], "explain": "ละครชาตรีมีตัวละคร 3 ตัว คือ ตัวนายโรง(พระ) ตัวนาง และตัวตลก"}, {"id": "H22", "chapter": 3, "q": "ละครในนิยมแสดงเรื่องใดบ้างตามที่ระบุไว้ในบทเรียน (3 เรื่อง)?", "opts": ["รามเกียรติ์ อิเหนา อุณรุท", "มโนห์รา ขุนช้างขุนแผน ไกรทอง", "จันทร์เจ้าขา แม่ศรีเรือน", "ราชาธิราช สามก๊ก"], "explain": "ละครในนิยมแสดง 3 เรื่อง คือ รามเกียรติ์ อิเหนา และอุณรุท"}, {"id": "H23", "chapter": 3, "q": "ผู้ปรับปรุงละครดึกดำบรรพ์ในสมัยรัชกาลที่ 5 คือใคร?", "opts": ["สมเด็จเจ้าฟ้ากรมพระยานริศรานุวัดติวงศ์", "พระเจ้าบรมวงศ์เธอกรมพระนราธิปประพันธ์พงศ์", "พระบาทสมเด็จพระมงกุฎเกล้าเจ้าอยู่หัว", "จอมพล ป. พิบูลสงคราม"], "explain": "สมเด็จเจ้าฟ้ากรมพระยานริศรานุวัดติวงศ์ทรงเป็นผู้ปรับปรุงละครดึกดำบรรพ์"}, {"id": "H24", "chapter": 3, "q": "ผู้ให้กำเนิดละครร้องในสมัยรัชกาลที่ 5 คือใคร?", "opts": ["พระเจ้าบรมวงศ์เธอกรมพระนราธิปประพันธ์พงศ์", "สมเด็จเจ้าฟ้ากรมพระยานริศรานุวัดติวงศ์", "พรานบูรพ์", "รัชกาลที่ 6"], "explain": "พระเจ้าบรมวงศ์เธอกรมพระนราธิปประพันธ์พงศ์ทรงเป็นผู้ให้กำเนิดละครร้อง"}, {"id": "H25", "chapter": 3, "q": "“จวงจันทร์” หรือนามปากกา “พรานบูรพ์” เป็นผู้ให้กำเนิดละครประเภทใด ในสมัยรัชกาลใด?", "opts": ["ละครเพลง ในสมัยรัชกาลที่ 7", "ละครพูด ในสมัยรัชกาลที่ 6", "ละครร้อง ในสมัยรัชกาลที่ 5", "ละครดึกดำบรรพ์ ในสมัยรัชกาลที่ 5"], "explain": "พรานบูรพ์เป็นผู้ให้กำเนิดละครเพลงในสมัยรัชกาลที่ 7"}, {"id": "H26", "chapter": 3, "q": "ละครเพลงเรื่องแรกในประวัติศาสตร์การแสดงละครเพลงของไทยคือเรื่องใด?", "opts": ["จันทร์เจ้าขา", "แม่ศรีเรือน", "ขวัญใจจอมโจร", "วงศ์สวรรค์"], "explain": "“จันทร์เจ้าขา” ของพรานบูรพ์ ถือเป็นละครเพลงเรื่องแรกในประวัติศาสตร์การแสดงละครเพลงไทย"}, {"id": "H27", "chapter": 3, "q": "ละครพันทางในสมัยรัชกาลที่ 5 นำเนื้อเรื่องมาจากแหล่งใด?", "opts": ["พงศาวดารของชาติต่างๆ", "วรรณคดีอินเดีย", "นิทานพื้นบ้านไทยเท่านั้น", "คัมภีร์ศาสนา"], "explain": "ละครพันทางนำเนื้อเรื่องมาจากพงศาวดารของชาติต่างๆ เช่น เรื่องราชาธิราช"}, {"id": "H28", "chapter": 3, "q": "เครื่องดนตรีพิเศษที่เรียกว่า “กรับเสภา” ใช้ประกอบละครประเภทใด?", "opts": ["ละครเสภา", "ละครดึกดำบรรพ์", "ละครพันทาง", "ละครใน"], "explain": "กรับเสภาเป็นเครื่องดนตรีประจำที่ใช้ประกอบละครเสภา"}, {"id": "H29", "chapter": 3, "q": "ตามบทเรียน ละครเวทีเกิดขึ้นเพื่อวัตถุประสงค์ใดในช่วงสงครามโลกครั้งที่ 2?", "opts": ["เป็นสิ่งบันเทิงทดแทนภาพยนตร์ที่ขาดแคลนผู้ผลิต", "เพื่อโฆษณาชวนเชื่อทางการเมืองเท่านั้น", "เพื่อฝึกทหาร", "เพื่อหารายได้ช่วยสงครามเท่านั้น"], "explain": "ละครเวทีเกิดขึ้นเพื่อเป็นสิ่งบันเทิงทดแทนภาพยนตร์ที่ขาดแคลนผู้ผลิตในช่วงสงคราม"}, {"id": "H30", "chapter": 3, "q": "คณะละครเพลงที่มีชื่อเสียงในยุคที่พรานบูรพ์สร้างสรรค์ผลงาน ตามที่ระบุในบทเรียนมีคณะใดบ้าง?", "opts": ["คณะจันทร์โรภาส คณะเฉลิม คณะแม่ช้อย และคณะศิลป์สำเริง", "คณะแก้วฟ้า คณะบุษปเกษเท่านั้น", "คณะเทเวศร์ คณะปรีดาลัย", "คณะโขนหลวง"], "explain": "บทเรียนระบุคณะละครเพลงที่มีชื่อเสียง ได้แก่ จันทร์โรภาส เฉลิม แม่ช้อย และศิลป์สำเริง"}, {"id": "H31", "chapter": 4, "q": "ตำแหน่ง “House Manager” ในการจัดการแสดงละครมีหน้าที่หลักตามบทเรียนคือข้อใด?", "opts": ["จัดการธุรกิจของโรงละคร ดูแลสถานที่แสดง และจำหน่ายบัตรเข้าชม", "เขียนบทละคร", "กำกับการแสดงบนเวที", "แต่งหน้านักแสดง"], "explain": "House Manager ดูแลธุรกิจของโรงละคร สถานที่แสดง และการจำหน่ายบัตร"}, {"id": "H32", "chapter": 4, "q": "แนวทางการจัดการแสดงตามบทเรียนมีทั้งหมดกี่ขั้นตอน อะไรบ้าง?", "opts": ["5 ขั้นตอน ได้แก่ พิจารณาบทละคร คัดเลือกนักแสดง จัดฉาก ฝึกซ้อม และประเมินผล", "4 ขั้นตอน", "6 ขั้นตอน", "3 ขั้นตอน"], "explain": "แนวทางการจัดการแสดงมี 5 ขั้นตอนตามที่ระบุในบทเรียน"}, {"id": "H33", "chapter": 4, "q": "ในการแสดงบทบาทสมมติ นักแสดงต้องมีความพร้อมด้านใดตามที่ระบุไว้?", "opts": ["ต้องมีความพร้อมที่จะใช้ร่างกาย อารมณ์ จิตใจ และความคิด รวมทั้งประสาทสัมผัสทั้งห้า", "ต้องมีความพร้อมด้านการร้องเพลงเท่านั้น", "ต้องท่องบทให้จำได้ทั้งหมด", "ต้องใส่หน้ากากเสมอ"], "explain": "บทบาทสมมติต้องอาศัยความพร้อมทั้งร่างกาย อารมณ์ จิตใจ ความคิด และประสาทสัมผัสทั้งห้า"}, {"id": "H34", "chapter": 4, "q": "สถานการณ์ที่กำหนดในการฝึกละครสดตามบทเรียนมีตัวอย่างกี่สถานการณ์ อะไรบ้าง?", "opts": ["อย่างน้อย 3 สถานการณ์ ได้แก่ ตลาด สนามเด็กเล่น และในบ้าน", "2 สถานการณ์", "5 สถานการณ์", "ไม่ได้ระบุไว้ในบทเรียน"], "explain": "บทเรียนยกตัวอย่างสถานการณ์ฝึกละครสด 3 สถานการณ์ คือ ตลาด สนามเด็กเล่น และในบ้าน"}, {"id": "H35", "chapter": 4, "q": "ตามบทเรียน บทละครที่นำมาใช้ฝึกหัดทักษะการแสดงเบื้องต้นควรมีระยะเวลาแสดงประมาณเท่าใด?", "opts": ["20-30 นาที", "5-10 นาที", "45-60 นาที", "2 ชั่วโมงขึ้นไป"], "explain": "บทละครฝึกหัดควรใช้เวลาแสดงประมาณ 20-30 นาที"}, {"id": "H36", "chapter": 4, "q": "ผู้กำกับเวที (Stage Manager) ตามบทเรียนต้องรับผิดชอบและติดต่อสั่งงานเกี่ยวกับเรื่องใดบ้าง?", "opts": ["ไฟ แสง เสียง และความเรียบร้อยของเวทีตลอดจนการเปิด-ปิดฉากละคร", "การขายบัตรเท่านั้น", "การเขียนบทละคร", "การแต่งหน้านักแสดง"], "explain": "ผู้กำกับเวทีรับผิดชอบเรื่องไฟ แสง เสียง และการเปิด-ปิดฉากตลอดการแสดง"}, {"id": "H37", "chapter": 4, "q": "เหตุใดตามบทเรียนจึงระบุว่า “ความสำเร็จของละครอยู่ที่ความร่วมมือ function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Build a randomized working copy: shuffle question order, and shuffle options
// within each question (tracking which shuffled index is correct).
function buildShuffled(setKey){
  const src = QUESTION_DATA[setKey];
  const order = shuffleArr(src.map((_,i)=>i));
  return order.map(idx=>{
    const item = src[idx];
    const optOrder = shuffleArr(item.opts.map((_,i)=>i)); // index 0 in opts is always correct
    const opts = optOrder.map(oi=>item.opts[oi]);
    const correctIndex = optOrder.indexOf(0);
    return {
      id:item.id, q:item.q, opts:opts, correctIndex:correctIndex, explain:item.explain
    };
  });
}

const state = {}; // setKey -> {questions, answered:{}, correctCount}

function labelLetter(i){ return ["ก","ข","ค","ง"][i]; }

function render(setKey){
  const panel = document.getElementById("panel-"+setKey);
  const st = state[setKey];
  let answeredCount = Object.keys(st.answered).length;
  let html = '';
  html += '<div class="toolbar">'
        + '<div class="score">ตอบถูก: '+st.correctCount+' / '+answeredCount+' (จากทั้งหมด '+st.questions.length+' ข้อ)'
        + '<div class="progresswrap"><div class="progressbar" style="width:'+(answeredCount/st.questions.length*100)+'%"></div></div>'
        + '</div>'
        + '<button class="reshuffle" onclick="reshuffle(\''+setKey+'\')">สลับข้อสอบใหม่ (สุ่มลำดับ)</button>'
        + '</div>';

  st.questions.forEach((item, qi)=>{
    const answered = st.answered[qi];
    html += '<div class="qcard">';
    html += '<div class="qnum">ข้อที่ '+(qi+1)+' จาก '+st.questions.length+'</div>';
    html += '<div class="qtext">'+item.q+'</div>';
    item.opts.forEach((opt, oi)=>{
      let cls = 'opt';
      let disabled = '';
      if(answered !== undefined){
        disabled = 'disabled';
        if(oi === item.correctIndex) cls += ' correct';
        else if(oi === answered && answered !== item.correctIndex) cls += ' wrong';
      }
      html += '<button class="'+cls+'" '+disabled+' onclick="answer(\''+setKey+'\','+qi+','+oi+')">'
            + labelLetter(oi)+'. '+opt+'</button>';
    });
    html += '<div class="explain'+(answered!==undefined?' show':'')+'">'
          + '<b>'+(answered!==undefined ? (answered===item.correctIndex ? 'ถูกต้อง — ' : 'ยังไม่ถูก — ') : '')+'</b>'
          + item.explain
          + '</div>';
    html += '</div>';
  });

  panel.innerHTML = html;
}

function answer(setKey, qi, oi){
  const st = state[setKey];
  if(st.answered[qi] !== undefined) return;
  st.answered[qi] = oi;
  if(oi === st.questions[qi].correctIndex) st.correctCount++;
  render(setKey);
}

function reshuffle(setKey){
  state[setKey] = { questions: buildShuffled(setKey), answered:{}, correctCount:0 };
  render(setKey);
}

// init all three sets on page load -> fresh shuffle every time page opens
["easy","medium","hard"].forEach(k=>{
  state[k] = { questions: buildShuffled(k), answered:{}, correctCount:0 };
  render(k);
});

document.querySelectorAll(".setbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".setbtn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.set).classList.add("active");
  });
});
</script>
