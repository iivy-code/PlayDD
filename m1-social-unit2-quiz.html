<script>
const QUESTION_DATA = {"easy": [{"id": "E1", "section": 1, "q": "How many countries are currently members of ASEAN?", "opts": ["11", "10", "9", "12"], "explain": "Southeast Asia today has 11 countries, all members of ASEAN."}, {"id": "E2", "section": 1, "q": "Southeast Asia's geography is divided into which two categories?", "opts": ["Mainland and Maritime (island)", "North and South", "Coastal and Inland", "Tropical and Temperate"], "explain": "The region is classified by geographical condition into Mainland Southeast Asia and Maritime (island) Southeast Asia."}, {"id": "E3", "section": 1, "q": "What is the general characteristic of Southeast Asia's weather?", "opts": ["Hot", "Cold", "Sandstorm-prone", "Dry all year"], "explain": "Southeast Asia has a generally hot, tropical climate."}, {"id": "E4", "section": 1, "q": "Which two countries are most often affected by earthquakes in Southeast Asia?", "opts": ["Indonesia and the Philippines", "Malaysia and Thailand", "Myanmar and Brunei", "Vietnam and Laos"], "explain": "Both countries sit on the Pacific Ring of Fire, making them prone to frequent earthquakes."}, {"id": "E5", "section": 1, "q": "What is the main factor causing rain and dry seasons on the Southeast Asian mainland?", "opts": ["Monsoon winds", "The Sunda plate", "The Equator line", "The size of the continent"], "explain": "Seasonal monsoon winds bring alternating dry and rainy periods to the mainland."}, {"id": "E6", "section": 1, "q": "Which river's original source is the Tibetan Plateau in Qinghai, China?", "opts": ["The Mekong River", "The Ganges River", "The Huang He River", "The Chao Phraya River"], "explain": "The Mekong River (4,909 km, the 12th longest in the world) originates from the Tibetan Plateau."}, {"id": "E7", "section": 1, "q": "Which theory explains the origin of early human migration into Southeast Asia?", "opts": ["Out of Africa Theory", "Big Bang Theory", "Continental Drift Theory", "Silk Road Theory"], "explain": "The Out of Africa Theory holds that humans migrated from their origin in West Africa to other regions, including Southeast Asia."}, {"id": "E8", "section": 1, "q": "According to the lesson, what were the TWO main reasons humans moved and migrated?", "opts": ["Settlement, and political/trade expansion", "War and famine only", "Climate change only", "Religion and language"], "explain": "Humans moved to settle in better places for food and living, and to expand political/trade power."}, {"id": "E9", "section": 1, "q": "Borneo island is divided among which three countries?", "opts": ["Indonesia, Malaysia, and Brunei", "Indonesia, Philippines, and Malaysia", "Malaysia, Singapore, and Brunei", "Thailand, Myanmar, and Laos"], "explain": "Borneo (Kalimantan) is shared by Indonesia (largest area), Malaysia (Sarawak and Sabah), and Brunei."}, {"id": "E10", "section": 1, "q": "Which spices from the 'Spice Islands' were highly valuable in the ancient and early trade world?", "opts": ["Cloves, nutmeg, and pepper", "Rice and wheat", "Coffee and tea", "Sugar and salt"], "explain": "Cloves, nutmeg, and pepper from present-day Indonesia were extremely valuable, driving trade to the region."}, {"id": "E11", "section": 2, "q": "Which kingdom is located in the 'West' region according to the lesson's location classification?", "opts": ["Mon / Sri Ksetra", "Funan", "Srivijaya", "Ancient Khmer"], "explain": "Mon and Sri Ksetra are classified as kingdoms of the West (in present-day Myanmar)."}, {"id": "E12", "section": 2, "q": "Which ancient kingdom was a maritime trading empire classified under 'Islands'?", "opts": ["Srivijaya", "Lan Xang", "Champa", "Ancient Khmer"], "explain": "Srivijaya was a powerful maritime trading kingdom based in the islands region."}, {"id": "E13", "section": 2, "q": "Bagan, home to more than 2,500 Buddhist stupas and temples, is located in which present-day country?", "opts": ["Myanmar", "Cambodia", "Vietnam", "Laos"], "explain": "Bagan, with its dense concentration of Buddhist monuments, is located in modern Myanmar."}, {"id": "E14", "section": 2, "q": "Which ancient kingdom, centered in Siem Reap, was established by King Jayavarman II?", "opts": ["Ancient Khmer (Angkor)", "Funan", "Dvaravati", "Lan Xang"], "explain": "The Angkor-era Ancient Khmer kingdom was founded by King Jayavarman II, centered in Siem Reap."}, {"id": "E15", "section": 2, "q": "Which belief system existed in Southeast Asia BEFORE all organized religions arrived?", "opts": ["Local beliefs", "Buddhism", "Brahmanism-Hinduism", "Islam"], "explain": "Local (indigenous) beliefs in natural and supernatural powers existed before organized religions spread into the region."}, {"id": "E16", "section": 2, "q": "Where did Brahmanism-Hinduism originate, and roughly how long ago?", "opts": ["India, about 5,000 years ago", "China, about 2,000 years ago", "Arabia, about 1,400 years ago", "Egypt, about 3,000 years ago"], "explain": "Brahmanism-Hinduism originated in India approximately 5,000 years ago."}, {"id": "E17", "section": 2, "q": "What is the name for Hinduism's group of three major gods?", "opts": ["Trimurti", "Bodhisattva", "Nirvana", "Karma"], "explain": "The Trimurti refers to the three major gods of Brahmanism-Hinduism."}, {"id": "E18", "section": 2, "q": "In what year did Islam originate on the Arabian Peninsula?", "opts": ["622 AD", "1000 AD", "500 BC", "1200 AD"], "explain": "Islam originated in the Arabian Peninsula in the year 622 AD."}, {"id": "E19", "section": 2, "q": "Islam is divided into how many major sects?", "opts": ["3 (Sunni, Shia, Sufi)", "2", "4", "5"], "explain": "Islam separated into three sects: Sunni, Shia, and Sufi."}, {"id": "E20", "section": 2, "q": "Which city is the center of the Christian Church, led by the Pope?", "opts": ["Vatican City", "Jerusalem", "Istanbul", "Rome (outside the Vatican)"], "explain": "The Vatican is the center of the Christian Church, and the Pope is its highest leader."}, {"id": "E21", "section": 3, "q": "What trade route's dominance by Muslim traders motivated Western Europeans to search for a sea route to Asia?", "opts": ["The Silk Road", "The Spice Route", "The Amber Road", "The Incense Route"], "explain": "European powers wanted to break free from Muslim and Italian traders' dominance of the Silk Road."}, {"id": "E22", "section": 3, "q": "Which two countries were the dominant colonial powers during the FIRST period of Western occupation (21st-22nd century B.E.)?", "opts": ["Portugal and Spain", "Britain and France", "The Netherlands and Britain", "Spain and the USA"], "explain": "Portugal and Spain led the first wave of Western colonization of Southeast Asia."}, {"id": "E23", "section": 3, "q": "Which two countries became the dominant colonial powers during the SECOND period (23rd-25th century B.E.)?", "opts": ["Britain and France", "Portugal and Spain", "Spain and the Netherlands", "The USA and the Netherlands"], "explain": "Britain and France became the leading colonial powers in the later period, driven partly by the Industrial Revolution."}, {"id": "E24", "section": 3, "q": "Spain colonized which Southeast Asian country?", "opts": ["The Philippines", "Indonesia", "Vietnam", "Myanmar"], "explain": "Spain colonized the Philippines and built Manila as its government center."}, {"id": "E25", "section": 3, "q": "Which country formed 'French Indochina', made up of Vietnam, Khmer, and Laos?", "opts": ["France", "Britain", "The Netherlands", "Portugal"], "explain": "France controlled Vietnam, Khmer (Cambodia), and Laos as French Indochina."}, {"id": "E26", "section": 3, "q": "The Dutch trading company that began trade in Indonesia before the government took over was called:", "opts": ["VOC", "EIC", "HBC", "DEIC"], "explain": "The VOC (Dutch East India Company) began as a private trading company before the Dutch government took control."}, {"id": "E27", "section": 3, "q": "During WWII, Japan formed an alliance with which two countries as the Axis Powers?", "opts": ["Germany and Italy", "Britain and France", "The USA and the USSR", "Spain and Portugal"], "explain": "Japan was allied with Germany and Italy as the Axis Powers during WWII."}, {"id": "E28", "section": 3, "q": "What was Japan's slogan used to justify its expansion into Southeast Asia?", "opts": ["The Greater East Asia Co-Prosperity Sphere", "Asia for Asians Only", "The New World Order", "Pacific Unity Doctrine"], "explain": "Japan's slogan was the Greater East Asia Co-Prosperity Sphere."}, {"id": "E29", "section": 3, "q": "Who was the Burmese nationalist leader known as the 'Father of the Nation', who sought Japanese help for Burmese liberation?", "opts": ["General Aung San", "Sukarno", "Ho Chi Minh", "Jose Rizal"], "explain": "General Aung San led Myanmar's nationalist movement and is remembered as the Father of the Nation."}, {"id": "E30", "section": 3, "q": "What resources did Japan seek from Southeast Asia to support its military during WWII?", "opts": ["Rice, oil, tin, and rubber", "Gold and silver only", "Timber only", "Fish and spices only"], "explain": "Japan sought rice, oil, tin, and rubber to supply its military forces."}, {"id": "E31", "section": 4, "q": "After WWII, the world divided into two ideological camps. What were they?", "opts": ["Liberal democratic states vs socialist communist states", "Monarchies vs republics", "Colonizers vs the colonized", "Christians vs Muslims"], "explain": "The post-WWII world split into liberal democratic states and socialist communist states — the Cold War divide."}, {"id": "E32", "section": 4, "q": "Who was the Prime Minister of Singapore for 31 years, developing it into a major port and technology hub?", "opts": ["Lee Kuan Yew", "Sukarno", "Aung San Suu Kyi", "Ferdinand Marcos"], "explain": "Lee Kuan Yew served as Singapore's Prime Minister for 31 years and led its rapid development."}, {"id": "E33", "section": 4, "q": "Who was the national hero of Indonesia who fought the Dutch and became the country's first elected president?", "opts": ["Sukarno", "Suharto", "Ho Chi Minh", "Pol Pot"], "explain": "Sukarno fought against Dutch rule and became Indonesia's first president."}, {"id": "E34", "section": 4, "q": "Which country remained under British protection before becoming fully independent in 2527 B.E.?", "opts": ["Brunei", "Singapore", "Malaysia", "Timor Leste"], "explain": "Brunei remained a British protectorate until achieving full independence in 2527 B.E."}, {"id": "E35", "section": 4, "q": "Which country annexed Timor Leste as its 27th province before granting it independence in 2545 B.E.?", "opts": ["Indonesia", "Portugal", "Australia", "Malaysia"], "explain": "Indonesia invaded and annexed Timor Leste before eventually granting independence."}, {"id": "E36", "section": 4, "q": "Who was the elected Philippine president whose 23-year rule ended after the US withdrew its support?", "opts": ["Ferdinand Marcos", "Jose Rizal", "Emilio Aguinaldo", "Corazon Aquino"], "explain": "President Ferdinand Marcos held power for 23 years before the US ended its support for his rule."}, {"id": "E37", "section": 4, "q": "Which famous battle led to France's defeat and the liberation of Vietnam, Laos, and Cambodia?", "opts": ["The Battle of Dien Bien Phu", "The Battle of Midway", "The Fall of Saigon", "The Tet Offensive"], "explain": "France's defeat at Dien Bien Phu led to the liberation of its Indochinese colonies."}, {"id": "E38", "section": 4, "q": "In Cambodia, which communist leader rose to power roughly 20 years after King Sihanouk cut ties with the US?", "opts": ["Pol Pot", "Ho Chi Minh", "Prince Souphanouvong", "Sukarno"], "explain": "Pol Pot led the communist party that rose to power in Cambodia around 20 years later."}, {"id": "E39", "section": 4, "q": "Who is the opposition party leader in Myanmar mentioned in the lesson?", "opts": ["Aung San Suu Kyi", "Aung San", "Sukarno", "Lee Kuan Yew"], "explain": "Aung San Suu Kyi is identified as the leader of the Opposition Party in Myanmar."}, {"id": "E40", "section": 4, "q": "Why did Singapore separate from Malaysia?", "opts": ["Their ethnicities and beliefs were different", "Singapore ran out of resources", "Malaysia expelled all foreigners", "They had a border war"], "explain": "Singapore separated from Malaysia due to differences in ethnicity and beliefs."}, {"id": "E41", "section": 5, "q": "What does UNESCO stand for?", "opts": ["United Nations Educational, Scientific and Cultural Organization", "United Nations Economic and Social Council", "United Southeast Asian Cultural Organization", "United Nations Environmental and Scientific Committee"], "explain": "UNESCO is the United Nations Educational, Scientific and Cultural Organization, which registers World Heritage Sites."}, {"id": "E42", "section": 5, "q": "Civilization sites in Southeast Asia are categorized into how many main groups?", "opts": ["2 (registered by UNESCO, and not registered)", "3", "4", "5"], "explain": "Sites are grouped into those registered as World Cultural Heritage by UNESCO, and those not registered."}, {"id": "E43", "section": 5, "q": "Which country is home to the Borobudur Temple Compounds?", "opts": ["Indonesia", "Cambodia", "Thailand", "Myanmar"], "explain": "Borobudur Temple Compounds, inscribed in 1991, is located in Indonesia."}, {"id": "E44", "section": 5, "q": "Which country is home to Hoi An Ancient Town?", "opts": ["Vietnam", "Laos", "The Philippines", "Malaysia"], "explain": "Hoi An Ancient Town, inscribed in 1999, is located in Vietnam."}, {"id": "E45", "section": 5, "q": "Which country is home to the Ban Chiang Archaeological Site?", "opts": ["Thailand", "Cambodia", "Myanmar", "Indonesia"], "explain": "The Ban Chiang Archaeological Site, inscribed in 1992, is located in Thailand."}, {"id": "E46", "section": 5, "q": "Which country is home to Bagan, Mandalay Region?", "opts": ["Myanmar", "Laos", "Vietnam", "Cambodia"], "explain": "Bagan, Mandalay Region, inscribed in 2019, is located in Myanmar."}, {"id": "E47", "section": 5, "q": "Which country is home to the Town of Luang Prabang?", "opts": ["Lao PDR", "Thailand", "Vietnam", "Cambodia"], "explain": "The Town of Luang Prabang, inscribed in 1995, is located in Lao PDR."}, {"id": "E48", "section": 5, "q": "Which country is home to the Temple of Preah Vihear?", "opts": ["Cambodia", "Thailand", "Laos", "Myanmar"], "explain": "The Temple of Preah Vihear, inscribed in 2008, is located in Cambodia."}, {"id": "E49", "section": 5, "q": "Which country is home to the Historic Town of Vigan?", "opts": ["The Philippines", "Indonesia", "Malaysia", "Vietnam"], "explain": "The Historic Town of Vigan, inscribed in 1999, is located in the Philippines."}, {"id": "E50", "section": 5, "q": "Which country is home to Melaka and George Town, Historic Cities of the Straits of Malacca?", "opts": ["Malaysia", "Singapore", "Indonesia", "Brunei"], "explain": "Melaka and George Town, inscribed in 2008, are located in Malaysia."}], "medium": [{"id": "M1", "section": 1, "q": "Which country's territory lies on BOTH the Southeast Asian mainland and an island?", "opts": ["Malaysia (Peninsular Malaysia + Borneo)", "Thailand", "Vietnam", "Cambodia"], "explain": "Malaysia has Peninsular Malaysia on the mainland and Sarawak/Sabah on the island of Borneo."}, {"id": "M2", "section": 1, "q": "Why do volcanic areas along the Ring of Fire support dense human settlement despite earthquake risk?", "opts": ["Volcanic activity fertilizes the soil, making it ideal for farming", "Volcanoes prevent flooding", "Volcanic ash blocks storms", "Volcanoes provide fresh water"], "explain": "Volcanic eruptions enrich the soil with minerals, creating fertile land well-suited for agriculture."}, {"id": "M3", "section": 1, "q": "What is the connection between monsoon winds and the two seasons on the mainland?", "opts": ["Winds from Siberia/South China bring cold, dry weather; winds from the Indian Ocean bring moisture", "Both wind directions bring the same weather", "Monsoons only affect islands, not the mainland", "Monsoons cause earthquakes"], "explain": "Seasonal wind reversal (monsoon) brings dry weather from the north and moisture-laden winds from the Indian Ocean."}, {"id": "M4", "section": 1, "q": "Which country actually has the MOST islands in Southeast Asia, based on total count?", "opts": ["Indonesia (about 10,000 archipelagos)", "The Philippines (about 7,000 islands)", "Malaysia", "Vietnam"], "explain": "Indonesia has around 10,000 islands, more than the Philippines' roughly 7,000, though the Philippines is the easternmost."}, {"id": "M5", "section": 1, "q": "Why does the Philippines face frequent typhoons?", "opts": ["Its rainy season faces storms from both the Pacific and Indian Oceans", "It is located far from any ocean", "It has no mountains to block storms", "It sits exactly on the Equator"], "explain": "The Philippines' geographic position exposes it to storms from both the Pacific and Indian Oceans, causing at least 5 typhoons a year."}, {"id": "M6", "section": 1, "q": "How does 'political and trade expansion' as a reason for human migration connect to later conflict?", "opts": ["The desire to expand wealth and power led to trade competition, wars, and attempts to monopolize resources", "It had no later consequences", "It only affected religious practices", "It only affected art and architecture"], "explain": "Expansion for wealth and stability eventually led to trade rivalry, war, and attempts at monopolizing valuable goods."}, {"id": "M7", "section": 1, "q": "Why was control of the Strait of Malacca considered such a valuable 'resource'?", "opts": ["It was (and is) one of the world's busiest sea trade routes connecting the Indian Ocean and South China Sea", "It had the richest fishing grounds in the world", "It was the only source of fresh water in the region", "It had no strategic value"], "explain": "Controlling the Strait of Malacca meant controlling a critical trade chokepoint between two oceans."}, {"id": "M8", "section": 1, "q": "Which resource-based fact best explains why ancient trading kingdoms like Srivijaya and Malacca became wealthy?", "opts": ["Their control of valuable spice and maritime trade routes", "Their large populations of farmers", "Their isolation from other civilizations", "Their cold climate"], "explain": "Wealth came from controlling trade in valuable resources like spices, connecting Southeast Asia to global commerce."}, {"id": "M9", "section": 1, "q": "What long-term historical pattern links the 'Resources' factor to the later Colonial Period?", "opts": ["The same resources (spices, tin, rubber) that enriched ancient kingdoms later attracted European colonizers", "Resources became worthless after ancient times", "Colonizers were not interested in resources", "Only religion motivated colonization"], "explain": "Spices, tin, and later rubber were resources that motivated both ancient trade and European colonization centuries later."}, {"id": "M10", "section": 1, "q": "Which of these is NOT one of the three fundamental factors that influenced change in Southeast Asia, according to the lesson?", "opts": ["Technology", "Topography", "Humans", "Resources"], "explain": "The three fundamental factors covered are Topography, Humans, and Resources — not Technology."}, {"id": "M11", "section": 2, "q": "According to the lesson's key takeaway, which came first into Southeast Asia — Buddhism or Brahmanism-Hinduism?", "opts": ["Buddhism came first; Brahmanism-Hinduism entered later", "Brahmanism-Hinduism came first", "They arrived at exactly the same time", "Neither came before local beliefs"], "explain": "The lesson explicitly states that Brahmanism-Hinduism entered the region later than Buddhism did."}, {"id": "M12", "section": 2, "q": "Why did the ruling class of Southeast Asian states accept Brahmanism-Hinduism?", "opts": ["Because it elevated the ruler's status to a god-king, promoting stability and legitimacy", "Because it was the only religion available", "Because it required no royal involvement", "Because it opposed local beliefs"], "explain": "Brahmanism-Hinduism's god-king concept helped legitimize and stabilize a ruler's reign and succession."}, {"id": "M13", "section": 2, "q": "Why is Vietnam different from most other Southeast Asian countries in terms of Buddhism?", "opts": ["Vietnam is the only country practicing Mahayana Buddhism, conveyed from China", "Vietnam does not practice Buddhism", "Vietnam only practices Theravada Buddhism", "Vietnam never adopted Buddhism"], "explain": "Vietnam uniquely practices Mahayana Buddhism, which came from China rather than from India directly."}, {"id": "M14", "section": 2, "q": "How did Islam spread into Southeast Asia, according to the lesson?", "opts": ["Through Indian traders from South India who had already converted to Islam", "Through direct military invasion from Arabia", "Through European colonizers", "Through Chinese emperors"], "explain": "Islam reached Southeast Asia via South Indian traders who had converted to Islam and brought it through trade."}, {"id": "M15", "section": 2, "q": "Which two Southeast Asian territories converted to Christianity, according to the lesson?", "opts": ["The Philippines and South Vietnam", "Indonesia and Malaysia", "Thailand and Cambodia", "Myanmar and Laos"], "explain": "The Philippines and South Vietnam were the two Southeast Asian territories that converted to Christianity."}, {"id": "M16", "section": 2, "q": "What common belief about the Naga is shared among Thai, Laotian, and Cambodian people?", "opts": ["Respect for the Naga as part of local/folk belief", "The Naga is considered evil and feared", "The Naga only appears in Vietnamese culture", "The Naga represents a Christian saint"], "explain": "Respect for the Naga is a shared local belief among Thai, Laotian, and Cambodian cultures."}, {"id": "M17", "section": 2, "q": "How do local beliefs typically get represented, according to the lesson?", "opts": ["Through concrete symbols and idols", "Through written scientific texts", "Through international treaties", "Through modern technology"], "explain": "Local/folk beliefs about supernatural and natural powers are represented concretely through symbols and idols."}, {"id": "M18", "section": 2, "q": "Which ancient kingdom's territory expanded to control the Mekong River Delta, southern Laos, and land as far as the Chao Phraya-Tha Chin River Basin?", "opts": ["Ancient Khmer (Angkor)", "Srivijaya", "Dvaravati", "Champa"], "explain": "The Ancient Khmer (Angkor) kingdom, founded by King Jayavarman II, expanded across a vast territory including these regions."}, {"id": "M19", "section": 2, "q": "What eventually happened to Vietnam after it developed as a state and was occupied by China?", "opts": ["It later expanded, then was colonized by France", "It remained independent forever", "It merged with Cambodia", "It was never colonized"], "explain": "After Chinese occupation and later expansion, Vietnam was eventually colonized by France."}, {"id": "M20", "section": 2, "q": "In Myanmar today, what shows the blending of old and new religious beliefs?", "opts": ["Spirits are worshipped alongside Buddhism", "Only Buddhism is practiced, with no other beliefs", "Local beliefs were completely eliminated", "Only Christianity is practiced"], "explain": "In Myanmar, traditional spirit worship continues alongside Buddhism, showing a blend of old and new beliefs."}, {"id": "M21", "section": 3, "q": "Why did Spain sail west across the Atlantic rather than south like Portugal?", "opts": ["Spain followed the spherical earth theory to reach Asia via a westward route", "Spain had no ships capable of sailing south", "Portugal blocked Spain's southern route entirely", "Spain wanted to avoid all trade with Asia"], "explain": "Spain used a west-bound Atlantic route based on the spherical earth theory, eventually reaching Asia via the Pacific."}, {"id": "M22", "section": 3, "q": "Why did the Netherlands allow Britain access to the Strait of Malacca in the 24th century B.E.?", "opts": ["The Netherlands needed British support", "Britain conquered the Netherlands", "The Strait had lost its trade value", "France demanded it on the Netherlands' behalf"], "explain": "The Netherlands needed Britain's support, so it allowed Britain to expand into the Strait of Malacca."}, {"id": "M23", "section": 3, "q": "What was Thailand's role during the 24th-century B.E. rivalry between Britain and France in Southeast Asia?", "opts": ["A buffer state between the two powers", "A colony of Britain", "A colony of France", "An ally of Japan"], "explain": "Thailand served as a buffer state between British-controlled Myanmar and French-controlled Indochina."}, {"id": "M24", "section": 3, "q": "How did Portugal's style of colonization differ from that of the Netherlands in the region?", "opts": ["Portugal mainly occupied strategic port cities via diplomacy, while the Netherlands expanded territorial control and forced labor systems", "Portugal used more military force than the Netherlands", "Portugal and the Netherlands used identical methods", "Portugal never established any colonies"], "explain": "Portugal focused on port cities and trade diplomacy, while the Netherlands (via the VOC) expanded control and imposed forced agriculture."}, {"id": "M25", "section": 3, "q": "What happened to local nationalists in the Philippines after the US took control from Spain?", "opts": ["The US suppressed the nationalist movement despite earlier hopes for liberty", "The US immediately granted full independence", "Nationalists were given control of the government", "The US had no policy toward nationalists"], "explain": "Although Filipino nationalists hoped the US would grant liberty, the US instead colonized and suppressed the movement."}, {"id": "M26", "section": 3, "q": "Why did Southeast Asian nationalists initially cooperate with Japan during WWII?", "opts": ["Japan expressed sympathy with nationalist movements and promised eventual independence", "Japan offered them money only", "They had no other options for survival", "Japan forced them through direct combat"], "explain": "Japan's rhetoric of sympathy and promises of independence encouraged nationalist cooperation during the Pacific War."}, {"id": "M27", "section": 3, "q": "How did Japan divide its military governance of occupied Southeast Asian territories?", "opts": ["The Army controlled developed, populous areas; the Navy controlled less-developed islands", "Only the Navy controlled all territories", "Only the Army controlled all territories", "Local governments retained all control"], "explain": "Japan split control between the Army (developed areas) and Navy (less-developed islands, including the South Pacific)."}, {"id": "M28", "section": 3, "q": "What ultimately turned many Southeast Asian nationalist movements against Japan?", "opts": ["Japan's promises of independence and respect for local customs were not honored in practice", "Japan gave too much independence too quickly", "Nationalists preferred Western colonizers from the start", "There was no conflict with Japan at all"], "explain": "Despite promises, Japan's practical conflicts with local governments led to eventual resistance."}, {"id": "M29", "section": 3, "q": "According to the lesson, why did the Malay states' nationalist movement focus on identity rather than independence at this stage?", "opts": ["Because British rule brought relative stability and prosperity", "Because Malaya had no distinct ethnic identity", "Because independence was already granted", "Because there was no British rule to resist"], "explain": "Since British administration brought stability and prosperity, Malay nationalism at this stage focused on preserving identity rather than demanding independence."}, {"id": "M30", "section": 3, "q": "What best explains why Japan targeted Southeast Asia's resources during WWII?", "opts": ["To supply its military with rice, oil, tin, and rubber for the war effort", "To trade the resources with the USA", "To preserve the resources untouched", "To sell them to European colonial powers"], "explain": "Japan needed Southeast Asian resources like rice, oil, tin, and rubber to sustain its wartime military operations."}, {"id": "M31", "section": 4, "q": "Why couldn't Vietnam, Laos, and Cambodia develop quickly after gaining liberation from France?", "opts": ["Indochina became a Cold War battlefield (the Vietnam War)", "They immediately became wealthy democracies", "France continued to rule them anyway", "They joined the Axis Powers"], "explain": "Although liberated, the region became the site of Cold War conflict, hindering development."}, {"id": "M32", "section": 4, "q": "What was the core conflict in Laos after independence?", "opts": ["A constitutional monarchy led by the king vs. socialist communism led by Prince Souphanouvong", "A war with Thailand", "A conflict between Buddhists and Christians", "A conflict over natural resources with Vietnam"], "explain": "Laos faced internal conflict between the monarchist government and communist forces led by Prince Souphanouvong."}, {"id": "M33", "section": 4, "q": "Why does Myanmar continue to face political instability after independence, according to the lesson?", "opts": ["Military leadership has limited freedom and committed human rights violations", "The country never had any government", "Independence was never actually achieved", "Neighboring countries invaded repeatedly"], "explain": "Since independence, Myanmar has faced military rule, limited freedoms, and human rights violations, causing instability."}, {"id": "M34", "section": 4, "q": "How did Timor Leste's situation change after gaining independence from Indonesia?", "opts": ["Its economy has improved and it recently became a member of ASEAN", "It was immediately invaded again", "It merged back into Indonesia", "Its economy collapsed permanently"], "explain": "After facing internal conflict, Timor Leste's economy has improved and it has recently joined ASEAN."}, {"id": "M35", "section": 4, "q": "What allowed Malaysia, Singapore, and Brunei to all achieve economic growth after independence?", "opts": ["A combination of British-era stability and strong post-independence leadership/development", "They were never colonized", "They united into a single country", "They rejected all foreign trade"], "explain": "Relative stability from British rule and later strong national development enabled economic growth in all three."}, {"id": "M36", "section": 4, "q": "What was the relationship between General Suharto's rule and Indonesia's communist movement?", "opts": ["Suharto staged a coup and violently suppressed the communist movement", "Suharto supported and expanded the communist movement", "Suharto had no relationship with the movement", "The communist movement overthrew Suharto"], "explain": "Suharto came to power through a coup and violently suppressed Indonesia's communist movement."}, {"id": "M37", "section": 4, "q": "Why did the US eventually stop supporting Ferdinand Marcos's government in the Philippines?", "opts": ["He took too much political power, going beyond constitutional limits", "The Philippines requested a new colonial ruler", "The US ran out of resources to support any government", "Marcos requested independence from the US"], "explain": "As Marcos accumulated excessive power, the US withdrew its support, contributing to the end of his 23-year rule."}, {"id": "M38", "section": 4, "q": "What connects King Norodom Sihanouk's actions to the later rise of the Khmer Rouge?", "opts": ["His break from the US created instability, and about 20 years later Pol Pot's communist party rose to power", "Sihanouk personally led the Khmer Rouge", "Sihanouk prevented Pol Pot from ever gaining power", "There is no historical connection"], "explain": "Sihanouk's break from the US was followed roughly 20 years later by the rise of Pol Pot's communist regime."}, {"id": "M39", "section": 4, "q": "Why is Singapore's post-independence development considered a notable success story in the region?", "opts": ["It transformed into a major international port, petroleum refining, and technology hub under strict governance", "It became the largest country in Southeast Asia by land area", "It refused all foreign trade", "It became a communist state"], "explain": "Despite its small size, Singapore developed into a globally significant port and technology/petroleum hub under Lee Kuan Yew's leadership."}, {"id": "M40", "section": 4, "q": "What lesson can be drawn from comparing Myanmar's post-independence instability with Singapore's post-independence success?", "opts": ["Different post-independence choices (military rule vs strong civilian development policy) led to very different national outcomes", "Both countries had identical outcomes", "Independence guaranteed the same result everywhere in Southeast Asia", "Only economic resources determined the outcome, not governance"], "explain": "The contrast between Myanmar and Singapore shows how differing post-independence governance choices led to very different national trajectories."}, {"id": "M41", "section": 5, "q": "Why are civilization sites considered crucial for a nation, according to the lesson?", "opts": ["They indicate the origin of ethnic groups and serve as a source of national pride for long, continuous advancement", "They are only useful for tourism income", "They have no cultural or historical significance", "They only matter to archaeologists"], "explain": "The lesson states these sites indicate ethnic origins and serve as a source of pride for a nation's continuous historical advancement."}, {"id": "M42", "section": 5, "q": "Which UNESCO site in Southeast Asia was inscribed earliest, in 1991?", "opts": ["Borobudur Temple Compounds (Indonesia)", "Hoi An Ancient Town (Vietnam)", "Bagan (Myanmar)", "Angkor Thom (Cambodia)"], "explain": "Borobudur Temple Compounds, inscribed in 1991, is the earliest of the sites listed in the lesson."}, {"id": "M43", "section": 5, "q": "Which UNESCO site listed in the lesson was the most recently inscribed, in 2019?", "opts": ["Bagan, Mandalay Region (Myanmar)", "Temple of Preah Vihear (Cambodia)", "Melaka and George Town (Malaysia)", "Hoi An Ancient Town (Vietnam)"], "explain": "Bagan, Mandalay Region, inscribed in 2019, is the most recent of the sites listed."}, {"id": "M44", "section": 5, "q": "Which THREE countries each have two UNESCO sites listed in the lesson?", "opts": ["Vietnam, the Philippines, and Cambodia", "Thailand, Laos, and Myanmar", "Indonesia, Malaysia, and Brunei", "Singapore, Brunei, and Timor Leste"], "explain": "Vietnam (Hoi An + Hue), the Philippines (Baroque Churches + Vigan), and Cambodia (Preah Vihear + Angkor Thom) each have two sites listed."}, {"id": "M45", "section": 5, "q": "In what year were both the Melaka/George Town site (Malaysia) and the Temple of Preah Vihear (Cambodia) inscribed?", "opts": ["2008", "1999", "1992", "1995"], "explain": "Both sites were inscribed as UNESCO World Heritage Sites in 2008."}, {"id": "M46", "section": 5, "q": "In what year were both Ban Chiang (Thailand) and Angkor Thom (Cambodia) inscribed?", "opts": ["1992", "1993", "1999", "1991"], "explain": "Both Ban Chiang and Angkor Thom were inscribed in 1992."}, {"id": "M47", "section": 5, "q": "In what year were both the Baroque Churches of the Philippines and the Complex of Hue Monuments (Vietnam) inscribed?", "opts": ["1993", "1992", "1995", "1999"], "explain": "Both sites were inscribed as UNESCO World Heritage Sites in 1993."}, {"id": "M48", "section": 5, "q": "In what year were both Hoi An Ancient Town (Vietnam) and the Historic Town of Vigan (Philippines) inscribed?", "opts": ["1999", "1993", "1995", "2008"], "explain": "Both Hoi An Ancient Town and the Historic Town of Vigan were inscribed in 1999."}, {"id": "M49", "section": 5, "q": "What is the significance of a civilization site being preserved 'for posterity'?", "opts": ["It is preserved so future generations can learn from and appreciate it", "It means the site is closed to all visitors", "It means the site will be demolished eventually", "It has no long-term significance"], "explain": "Preserving a site for posterity means keeping it intact for future generations to study and appreciate."}, {"id": "M50", "section": 5, "q": "Why might a country consider its UNESCO World Heritage Sites a source of national pride?", "opts": ["Because they represent evidence of the country's long, continuous historical advancement", "Because UNESCO pays countries for each site", "Because it guarantees increased trade income", "Because it replaces the need for a national history"], "explain": "These sites serve as tangible evidence of a nation's long and continuous historical development, which is a source of pride."}], "hard": [{"id": "H1", "section": 1, "q": "How many total kilometers long is the Mekong River, and what is its global rank?", "opts": ["4,909 km — the 12th longest river in the world", "2,000 km — the 5th longest", "6,300 km — the longest in Asia", "3,500 km — the 20th longest"], "explain": "The Mekong River is 4,909 km long, ranking 12th longest in the world."}, {"id": "H2", "section": 1, "q": "What is the average temperature range of Southeast Asia's tropical climatic zone, and why is it significant?", "opts": ["18-25°C, which is very well suited to human settlement", "30-40°C, too hot for settlement", "0-10°C, suited only to farming", "10-15°C, ideal for industry only"], "explain": "The tropical zone's 18-25°C average temperature makes it highly suitable for human settlement."}, {"id": "H3", "section": 1, "q": "Which specific ocean areas bring storms to the Philippines during the rainy season?", "opts": ["Both the Pacific and Indian Oceans", "Only the Pacific Ocean", "Only the Indian Ocean", "Only the South China Sea"], "explain": "The Philippines faces storms from both the Pacific and Indian Ocean sides during its rainy season."}, {"id": "H4", "section": 1, "q": "What two effects does the Ring of Fire have on Southeast Asian islands, according to the lesson?", "opts": ["It causes earthquakes/volcanic eruptions, but also creates fertile soil for farming and settlement", "It only causes destruction with no benefits", "It prevents any human settlement", "It only affects ocean currents"], "explain": "While the Ring of Fire brings seismic and volcanic hazards, it also fertilizes soil, encouraging settlement and farming."}, {"id": "H5", "section": 1, "q": "What role do coastlines play in supporting maritime trade in the region, according to the lesson?", "opts": ["They block out winds and waves, creating favorable conditions for maritime travel and trade", "They make maritime travel impossible", "They only support fishing, not trade", "They have no effect on trade"], "explain": "Sheltered coastlines create calmer waters, which supports maritime travel and trade in the region."}, {"id": "H6", "section": 1, "q": "Which mineral resource, especially associated with the Malay Peninsula, was historically significant for trade?", "opts": ["Tin", "Coal", "Iron ore", "Diamonds"], "explain": "Tin from the Malay Peninsula was a historically significant traded mineral resource."}, {"id": "H7", "section": 1, "q": "What historical link exists between 'Political and trade expansion' (a human migration factor) and the ancient trading kingdoms discussed later in the unit?", "opts": ["The same drive to expand wealth and power that motivated migration also drove kingdoms like Funan and Srivijaya to become trading powers", "There is no connection between the two topics", "Migration stopped once kingdoms were established", "Trade expansion only began after colonization"], "explain": "The desire for wealth, power, and stability that drove early human migration also explains the rise of trading kingdoms."}, {"id": "H8", "section": 1, "q": "Besides fertile volcanic soil and spices, what other TWO categories of resources does the lesson highlight as important to Southeast Asia's development?", "opts": ["Minerals (tin, gold) and marine resources (fish, pearls, trade routes)", "Oil and natural gas only", "Timber and paper only", "Coal and steel only"], "explain": "The lesson highlights minerals (tin and gold) and marine resources (fish, pearls, and trade routes) alongside soil and spices."}, {"id": "H9", "section": 1, "q": "How does the fact that Malaysia spans both mainland and island territory reflect the broader 'Mainland vs Maritime' framework used to classify the region?", "opts": ["It shows that the mainland/maritime division is a geographic generalization, with some countries falling into both categories", "It disproves the mainland/maritime classification entirely", "It means Malaysia is not part of Southeast Asia", "It means the classification only applies to islands"], "explain": "Malaysia is an exception that shows the mainland/maritime framework is a useful generalization rather than a strict rule."}, {"id": "H10", "section": 1, "q": "Why does the lesson connect the 'Out of Africa Theory' (Humans) to the later development of ancient trading kingdoms covered in the next section?", "opts": ["Because the same migratory drive to find resources and expand power that started with early humans eventually produced organized, resource-driven trading states", "Because the Out of Africa Theory has no connection to later Southeast Asian history", "Because kingdoms formed before humans ever migrated to the region", "Because trading kingdoms only formed after colonization, unrelated to migration"], "explain": "The unit frames early human migration (for resources and power) as the root cause behind the later rise of resource- and trade-driven kingdoms."}, {"id": "H11", "section": 2, "q": "Which four kingdoms/states are listed under the 'East' location classification in the lesson?", "opts": ["Funan, Champa, Ancient Khmer, and Lan Xang", "Mon, Sri Ksetra, Dvaravati, and Malacca", "Srivijaya, Java states, Malacca, and Funan", "Bagan, Angkor, Sukhothai, and Ayutthaya"], "explain": "The East classification includes Funan, Champa, Ancient Khmer, and Lan Xang."}, {"id": "H12", "section": 2, "q": "According to the True/False review, is the statement 'the ruling class accepted Buddhism because it elevated their status as god-kings' true or false, and why?", "opts": ["False — that reasoning applies to Brahmanism-Hinduism's god-king concept, not Buddhism", "True — Buddhism directly created the god-king concept", "False — no Southeast Asian ruler ever used religion for legitimacy", "True — this applied equally to all religions"], "explain": "The lesson marks this statement False, since the god-king legitimacy concept is specifically tied to Brahmanism-Hinduism."}, {"id": "H13", "section": 2, "q": "What specific concept from Brahmanism-Hinduism describes freedom from the cycle of reincarnation and reunification with the Absolute Soul?", "opts": ["Reaching Brahman through karma, breaking the cycle of reincarnation", "Reaching Nirvana through meditation", "Following the Ten Royal Virtues", "Practicing Bodhisattva teachings"], "explain": "Brahmanism-Hinduism's ultimate goal is to escape reincarnation and reunite with Brahman (the Absolute Soul) through karma."}, {"id": "H14", "section": 2, "q": "What is the 'Bodhisattva' concept, as described in the context of Buddhism's spread through Southeast Asia?", "opts": ["A blending of Buddhist teachings with indigenous gods and beliefs as Buddhism spread and merged with local cultures", "A term for the first Buddhist king", "A specific branch of Islam", "A Christian saint recognized in Vietnam"], "explain": "As Buddhism spread, it merged with local belief systems, giving rise to concepts like the Bodhisattva within Mahayana Buddhism."}, {"id": "H15", "section": 2, "q": "What historical/political tool did Southeast Asian rulers use, tied to Buddhism, to strengthen their bond with their people?", "opts": ["The concept of the Ten Royal Virtues", "The Trimurti", "The Silk Road treaties", "The Magna Carta"], "explain": "Rulers used the concept of the Ten Royal Virtues (a Buddhist-influenced concept) to strengthen their connection with citizens."}, {"id": "H16", "section": 2, "q": "Which century B.E. did Theravada Buddhism play a major role in Southeast Asia, supported by kings?", "opts": ["The 18th century B.E.", "The 5th century B.E.", "The 25th century B.E.", "The 10th century B.E."], "explain": "Theravada Buddhism became especially prominent in the 18th century B.E. with royal support."}, {"id": "H17", "section": 2, "q": "What group in Java, Sumatra, and other islands eventually established Islamic states, according to the lesson?", "opts": ["Local rulers who converted to Islam through trade contact", "European colonizers", "Chinese merchants", "Buddhist monks"], "explain": "Local rulers in Java, Sumatra, and nearby islands converted to Islam and established Islamic states."}, {"id": "H18", "section": 2, "q": "Which trading groups attempted to build an east-west trading empire spanning from the Bay of Bengal to the South China Sea and Spice Islands?", "opts": ["Arabian, Persian, and Moor traders", "Portuguese and Spanish traders", "Dutch and British traders", "Chinese and Japanese traders"], "explain": "Arabian, Persian, and Moor traders sought to dominate this vast east-west trade network."}, {"id": "H19", "section": 2, "q": "What unique funeral practice does the Minangkabau tribe in Indonesia still hold onto today, according to the lesson?", "opts": ["Funerals held in the same fashion as ancient times", "Funerals that follow strict Christian rites", "Funerals combining Islamic and Hindu rites equally", "No funeral traditions remain"], "explain": "The Minangkabau tribe in Indonesia still practices funeral customs similar to ancient traditions."}, {"id": "H20", "section": 2, "q": "How did the Ancient Khmer Empire's territorial reach compare to other kingdoms discussed in the unit?", "opts": ["It was one of the largest, stretching from the Mekong Delta and southern Laos to the Chao Phraya-Tha Chin River Basin", "It was the smallest kingdom in Southeast Asia", "It only controlled a small city-state", "It never expanded beyond Siem Reap"], "explain": "The Ancient Khmer Empire's territory was vast, covering the Mekong Delta, southern Laos, and reaching into the Chao Phraya-Tha Chin Basin."}, {"id": "H21", "section": 3, "q": "What TWO factors combined to shift colonial dominance from Portugal/Spain to Britain/France in the 23rd-25th century B.E.?", "opts": ["The Industrial Revolution and political competition among Western powers", "Religious conflict and a shortage of ships", "The discovery of America and a decline in trade", "Natural disasters and disease outbreaks"], "explain": "The Industrial Revolution's demand for resources/markets, combined with political rivalry, drove the shift in colonial power."}, {"id": "H22", "section": 3, "q": "What ultimately happened to Spain's hold on the Philippines by the end of the colonial period?", "opts": ["Spain lost the Philippines to the USA following the Spanish-American War", "Spain kept the Philippines until WWII", "The Philippines became independent directly from Spain", "Britain took over the Philippines from Spain"], "explain": "Spain lost control of the Philippines to the United States after their war."}, {"id": "H23", "section": 3, "q": "How did the VOC's approach to Indonesia change over time, according to the lesson?", "opts": ["It began as a private trading company (VOC) and later came under full government control, expanding into Java and Sumatra with forced agriculture", "It remained a private company throughout its history", "It never expanded beyond Malacca", "It immediately became a government colony with no trading company phase"], "explain": "The VOC started as private Dutch trade, later backed by government, expanding control and imposing forced agricultural systems."}, {"id": "H24", "section": 3, "q": "How did British colonial administration of Burma change after WWI?", "opts": ["Burma became a direct British colony, having previously been governed via the Governor of India", "Burma became fully independent after WWI", "Burma was given to France after WWI", "Britain withdrew from Burma entirely after WWI"], "explain": "Before WWI, Burma was governed through India's Governor; after WWI, it became a direct British colony."}, {"id": "H25", "section": 3, "q": "Why was France's early relationship with Siam short-lived, according to the lesson?", "opts": ["Due to Siam's internal political turmoil", "Because Siam declared war on France", "Because Britain forced France to leave", "Because Siam converted to Christianity, angering France"], "explain": "France's attempt to strengthen relations with Siam was cut short due to Siam's internal political turmoil."}, {"id": "H26", "section": 3, "q": "What was the key difference between the nationalist movement in Vietnam versus in Laos and Cambodia during this period?", "opts": ["Vietnam's movement involved violent resistance across all social classes, while Laos and Cambodia's movements were far less active", "Laos and Cambodia had more violent movements than Vietnam", "All three had identical levels of activity", "None of the three had any nationalist activity"], "explain": "Vietnam's resistance was broad and violent, while nationalist activity in Laos and Cambodia was comparatively muted."}, {"id": "H27", "section": 3, "q": "According to the PDF summary, what specific SEA locations formed the command center and coverage area of Japan's supported nationalist operations?", "opts": ["Singapore as the command center, covering Myanmar, the Philippines, Indonesia, Indochina, and the Strait of Malacca", "Manila as the command center, covering only the Philippines", "Tokyo as the command center, covering all of Asia", "Jakarta as the command center, covering only Indonesia"], "explain": "Japan's supported operations used Singapore as a command center, covering Myanmar, the Philippines, Indonesia, Indochina, and the Strait of Malacca."}, {"id": "H28", "section": 3, "q": "What THREE categories of impact did WWII and the Japanese occupation have on Southeast Asia, according to the lesson?", "opts": ["Politics, Economics, and Society", "Religion, Language, and Art", "Only Economics", "Only Politics and Religion"], "explain": "The lesson organizes WWII/occupation impacts into three categories: Politics, Economics, and Society."}, {"id": "H29", "section": 3, "q": "What social problems specifically resulted from the destruction and hardship of WWII, according to the lesson?", "opts": ["Orphaned children, crime, prostitution, and slum communities", "Only higher birth rates", "Only improved education systems", "Only increased tourism"], "explain": "The lesson lists orphaned children, crime, prostitution, and slum communities as social consequences of wartime hardship."}, {"id": "H30", "section": 3, "q": "Why is it notable that many Southeast Asian countries 'returned colonial power' as a political response to Japanese occupation?", "opts": ["It shows that resisting Japan sometimes meant re-aligning with the very colonial powers nationalists had originally opposed", "It means nationalist movements achieved nothing", "It means colonial powers welcomed Japan's occupation", "It means Japan and Western colonizers were allies throughout the war"], "explain": "Ironically, some Southeast Asian states turned back to former colonial rulers as allies to help resist Japan's occupation."}, {"id": "H31", "section": 4, "q": "What is the underlying historical link between the Battle of Dien Bien Phu and the later Vietnam War?", "opts": ["France's defeat led to liberation, but the resulting power vacuum turned Indochina into a Cold War battleground (the Vietnam War)", "Dien Bien Phu directly caused Japan's WWII surrender", "The battle prevented any future conflict in the region", "France won the battle, delaying independence"], "explain": "France's loss at Dien Bien Phu freed Indochina but set the stage for Cold War conflict, including the Vietnam War."}, {"id": "H32", "section": 4, "q": "How does Suharto's 30-year rule in Indonesia connect to the earlier Cold War ideological conflict mentioned in the unit?", "opts": ["Suharto's violent suppression of communism aligned Indonesia with the liberal/anti-communist side of the Cold War divide", "Suharto supported the communist camp fully", "There is no link between Suharto and the Cold War", "Suharto was neutral in all ideological matters"], "explain": "Suharto's anti-communist coup and rule positioned Indonesia within the broader Cold War struggle against socialist/communist expansion."}, {"id": "H33", "section": 4, "q": "What connects Aung San's assassination to Myanmar's post-independence instability described in the unit?", "opts": ["His death just before independence removed a unifying leader, contributing to the political instability Myanmar faced afterward", "His assassination caused immediate independence", "His death had no effect on Myanmar's future", "He was never actually involved in politics"], "explain": "Aung San's assassination just six months before independence removed a key unifying figure, arguably contributing to later instability."}, {"id": "H34", "section": 4, "q": "How did Timor Leste's path to independence differ from most other Southeast Asian states covered in the unit?", "opts": ["It first gained independence from a European colonizer (Portugal), then was invaded and annexed by a fellow Southeast Asian state (Indonesia) before finally gaining lasting independence", "It went straight from colonial rule to lasting independence with no further conflict", "It was never colonized by any country", "It gained independence at the same time as all other ASEAN members"], "explain": "Timor Leste's unique path involved colonization by Portugal, annexation by Indonesia, and finally independence — a double liberation."}, {"id": "H35", "section": 4, "q": "Why might Brunei's, Singapore's, and Malaysia's shared British colonial background be considered a factor in their later economic success?", "opts": ["British-era administrative and economic structures, combined with strong post-independence leadership, supported their development", "British rule guaranteed automatic wealth for any former colony", "None of these countries had contact with Britain", "Their success came entirely from natural resources alone"], "explain": "A combination of institutional legacy from British rule and effective independent leadership helped these three states develop economically."}, {"id": "H36", "section": 4, "q": "What common thread links Aung San Suu Kyi's role in Myanmar and Sukarno's role in Indonesia, despite their different eras?", "opts": ["Both are/were key opposition or founding figures whose political struggles shaped their nations' post-independence direction", "Both were military dictators who suppressed democracy", "Both refused to engage in politics", "Both led their countries during Japanese occupation"], "explain": "Though from different periods, both figures played central roles in shaping their nations' political struggles and directions."}, {"id": "H37", "section": 4, "q": "Based on the unit, why does the lesson emphasize BOTH the ideological Cold War conflict AND individual country case studies?", "opts": ["To show how a global ideological conflict (democracy vs communism) played out differently in each Southeast Asian country's unique circumstances", "Because the two topics are unrelated", "Because only the global conflict mattered, not individual countries", "Because individual countries were unaffected by global politics"], "explain": "The unit connects the global Cold War framework to specific, varied outcomes in each Southeast Asian country."}, {"id": "H38", "section": 4, "q": "What does the case of the Philippines under Marcos suggest about the relationship between the US and its former colony after independence?", "opts": ["Even after independence, the US retained significant influence and could withdraw support to help end a leader's rule", "The US had no further involvement in the Philippines after independence", "The Philippines became completely isolated from the US", "Marcos was installed and removed entirely by local forces with no US role"], "explain": "The US's withdrawal of support was a decisive factor in ending Marcos's 23-year rule, showing continued US influence post-independence."}, {"id": "H39", "section": 4, "q": "How does Cambodia's post-independence history illustrate a broader pattern seen in Vietnam and Laos as well?", "opts": ["All three Indochinese states experienced internal conflict between different political ideologies following independence from France", "All three achieved untroubled peace immediately after independence", "None of the three had any internal conflicts", "All three remained French colonies permanently"], "explain": "Vietnam, Laos, and Cambodia all experienced significant internal ideological conflict (monarchist/nationalist vs communist) after gaining independence from France."}, {"id": "H40", "section": 4, "q": "Considering all the country cases in this unit, what overall theme best describes Southeast Asia's post-WWII experience?", "opts": ["Gaining formal independence did not automatically bring stability — many states faced ongoing ideological, political, or economic struggles afterward", "Every country achieved instant peace and prosperity right after independence", "No Southeast Asian country faced any conflict after WWII", "Independence had no lasting effect on any country's development"], "explain": "Across Myanmar, Indochina, Indonesia, and the Philippines, independence was often followed by continued political or ideological struggle rather than instant stability."}, {"id": "H41", "section": 5, "q": "According to the 'Review in short' section, what TWO things do humans accept, fear, and respect, forming an abstract local belief?", "opts": ["Natural power and supernatural power", "Kings and priests", "Wealth and status", "Colonizers and traders"], "explain": "The review states that humans accept, fear, and respect natural power and supernatural power as the basis of local belief."}, {"id": "H42", "section": 5, "q": "How is the abstract belief in natural and supernatural power typically represented concretely, according to the review?", "opts": ["By creating symbols or idols", "By writing sacred texts only", "By building international treaties", "By using only oral storytelling"], "explain": "The review states this abstract belief is represented concretely through creating symbols or idols."}, {"id": "H43", "section": 5, "q": "According to the review, Brahmanism spread into Southeast Asia at the same time as which TWO activities of Indian traders?", "opts": ["Seeking fortune and trade", "Farming and fishing", "Warfare and conquest", "Teaching and translation"], "explain": "The review states Brahmanism spread alongside the seeking of fortune and trade carried out by Indian traders."}, {"id": "H44", "section": 5, "q": "What are the THREE stages used to divide the development of Southeast Asian history, according to the review?", "opts": ["Ancient states and kingdoms; Western colonization; post-WWII independent states", "Stone Age; Bronze Age; Iron Age", "Pre-history; colonial history; modern history", "Local beliefs; world religions; secularism"], "explain": "The review confirms the same three stages used throughout the unit: ancient states and kingdoms, Western colonization, and post-WWII independent states."}, {"id": "H45", "section": 5, "q": "According to Ptolemy's geographical text from the Roman Empire, what name and meaning was used to refer to Southeast Asia?", "opts": ["Suvarnabhumi (Suphanabhumi), meaning 'the land of gold and prosperity'", "Taprobane, meaning 'the island of spices'", "Cathay, meaning 'the eastern kingdom'", "Serica, meaning 'the land of silk'"], "explain": "Ptolemy's text refers to the region as Suvarnabhumi (transliterated Suphanabhumi), meaning the land of gold and prosperity."}, {"id": "H46", "section": 5, "q": "In what historical/geographical context is Ptolemy's reference to Southeast Asia presented in the lesson?", "opts": ["A geographical text from the Roman Empire", "A Chinese imperial record", "An Arab trading manual", "A Buddhist religious scripture"], "explain": "The lesson specifically attributes this reference to Ptolemy's geographical text from the Roman Empire."}, {"id": "H47", "section": 5, "q": "Which organization is responsible for registering World Heritage Sites, according to the review?", "opts": ["UNESCO", "The United Nations Security Council", "ASEAN", "The World Bank"], "explain": "UNESCO (the United Nations Educational, Scientific and Cultural Organization) registers World Heritage Sites."}, {"id": "H48", "section": 5, "q": "Based on the inscription years given in the lesson, which decade had the MOST Southeast Asian UNESCO sites inscribed among those listed?", "opts": ["The 1990s", "The 1980s", "The 2000s", "The 2010s"], "explain": "Eight of the eleven sites listed (Borobudur 1991, Ban Chiang 1992, Angkor Thom 1992, Baroque Churches 1993, Hue 1993, Luang Prabang 1995, Hoi An 1999, Vigan 1999) were inscribed in the 1990s."}, {"id": "H49", "section": 5, "q": "How does the Suvarnabhumi ('land of gold') reference connect to the unit's earlier discussion of Southeast Asia's resources (Section 1.3)?", "opts": ["Both point to Southeast Asia's historical reputation for valuable natural wealth that attracted outside interest for centuries", "They are unrelated facts from different topics", "Suvarnabhumi refers only to modern mining, unrelated to ancient resources", "The resources section only discussed spices, not gold"], "explain": "Both the Resources section and the Suvarnabhumi reference highlight Southeast Asia's long-standing reputation for valuable natural wealth."}, {"id": "H50", "section": 5, "q": "Why does the lesson distinguish between civilization sites that ARE registered by UNESCO and those that are NOT?", "opts": ["To show that a site's historical or cultural importance doesn't depend solely on international recognition", "Because unregistered sites have no historical value at all", "Because only registered sites are allowed to be visited", "Because UNESCO registration is required for a site to exist"], "explain": "The distinction shows that many culturally and historically important sites exist in the region even without formal UNESCO recognition."}]};
const SECTION_LABEL = {1:"1. Factors", 2:"2. Kingdoms & Religion", 3:"3. Colonial & Japan", 4:"4. Post-WWII", 5:"5. Heritage Sites"};

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function buildShuffled(setKey){
  const src = QUESTION_DATA[setKey];
  const order = shuffleArr(src.map((_,i)=>i));
  return order.map(idx=>{
    const item = src[idx];
    const optOrder = shuffleArr(item.opts.map((_,i)=>i));
    const opts = optOrder.map(oi=>item.opts[oi]);
    const correctIndex = optOrder.indexOf(0);
    return { id:item.id, section:item.section, q:item.q, opts:opts, correctIndex:correctIndex, explain:item.explain };
  });
}
const state = {};
function labelLetter(i){ return ["A","B","C","D"][i]; }

function render(setKey){
  const panel = document.getElementById("panel-"+setKey);
  const st = state[setKey];
  let answeredCount = Object.keys(st.answered).length;
  let html = '';
  html += '<div class="toolbar">'
        + '<div class="score">Correct: '+st.correctCount+' / '+answeredCount+' (out of '+st.questions.length+' items)'
        + '<div class="progresswrap"><div class="progressbar" style="width:'+(answeredCount/st.questions.length*100)+'%"></div></div>'
        + '</div>'
        + '<button class="reshuffle" onclick="reshuffle(\''+setKey+'\')">Shuffle again</button>'
        + '</div>';

  st.questions.forEach((item, qi)=>{
    const answered = st.answered[qi];
    html += '<div class="qcard">';
    html += '<div class="qnum">Item '+(qi+1)+' of '+st.questions.length+'<span class="sectiontag">'+SECTION_LABEL[item.section]+'</span></div>';
    html += '<div class="qtext">'+item.q+'</div>';
    item.opts.forEach((opt, oi)=>{
      let cls = 'opt'; let disabled = '';
      if(answered !== undefined){
        disabled = 'disabled';
        if(oi === item.correctIndex) cls += ' correct';
        else if(oi === answered && answered !== item.correctIndex) cls += ' wrong';
      }
      html += '<button class="'+cls+'" '+disabled+' onclick="answer(\''+setKey+'\','+qi+','+oi+')">'
            + labelLetter(oi)+'. '+opt+'</button>';
    });
    html += '<div class="explain'+(answered!==undefined?' show':'')+'">'
          + '<b>'+(answered!==undefined ? (answered===item.correctIndex ? 'Correct — ' : 'Not quite — ') : '')+'</b>'
          + item.explain
          + '</div>';
    html += '</div>';
  });
  panel.innerHTML = html;
}
function answer(setKey, qi, oi){
  const st = state[setKey];
  if(st.answered[qi] !== undefined) return;
  st.answered[qi] = oi;
  if(oi === st.questions[qi].correctIndex) st.correctCount++;
  render(setKey);
}
function reshuffle(setKey){
  state[setKey] = { questions: buildShuffled(setKey), answered:{}, correctCount:0 };
  render(setKey);
}
["easy","medium","hard"].forEach(k=>{
  state[k] = { questions: buildShuffled(k), answered:{}, correctCount:0 };
  render(k);
});
document.querySelectorAll(".setbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".setbtn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.set).classList.add("active");
  });
});
</script>
