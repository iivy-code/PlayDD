<script>
const QUESTION_DATA = {"easy": [{"id": "E1", "unit": 3, "q": "According to the grammar rule, which forms are used for things that are necessary or obligatory?", "opts": ["have to / must", "don't have to", "mustn't", "can / can't"], "explain": "The rule states: We use have to and must for things that are necessary or obligatory."}, {"id": "E2", "unit": 3, "q": "Which form do we use for things that are NOT necessary — we can do them if we want?", "opts": ["don't have to", "must", "mustn't", "have to"], "explain": "Don't have to describes something that is optional, not required."}, {"id": "E3", "unit": 3, "q": "Which form do we use for things we can't do because we don't have permission?", "opts": ["mustn't", "don't have to", "have to", "can"], "explain": "Mustn't expresses prohibition — something not allowed."}, {"id": "E4", "unit": 3, "q": "What is the negative form of 'have to' for he/she?", "opts": ["doesn't have to", "don't have to", "isn't have to", "hasn't to"], "explain": "For he/she, the negative of have to is doesn't have to."}, {"id": "E5", "unit": 3, "q": "Complete the short answer: 'Do you have to wear a uniform?' 'Yes, ___.'", "opts": ["I do", "I have", "I am", "I must"], "explain": "Short answers with have to use do/does: Yes, I do. / No, I don't."}, {"id": "E6", "unit": 3, "q": "What is the adverb form of 'slow'?", "opts": ["slowly", "slowlly", "sloly", "slowley"], "explain": "Most adverbs of manner are formed by adding -ly to the adjective: slow → slowly."}, {"id": "E7", "unit": 3, "q": "What is the irregular adverb form of 'good'?", "opts": ["well", "goodly", "gooder", "goodly"], "explain": "Good is irregular — its adverb form is well, not \"goodly\"."}, {"id": "E8", "unit": 3, "q": "Which body part is at the end of your leg?", "opts": ["foot", "wrist", "elbow", "shoulder"], "explain": "The foot is located at the end of the leg."}, {"id": "E9", "unit": 3, "q": "Which sport is played with a shuttlecock and a racket?", "opts": ["badminton", "hockey", "rugby", "golf"], "explain": "Badminton uses a shuttlecock and a racket."}, {"id": "E10", "unit": 3, "q": "Which physical activity means to move quickly across ice or ground using skates?", "opts": ["skate", "climb", "dive", "sail"], "explain": "To skate means to move using skates, e.g. ice skating or in-line skating."}, {"id": "E11", "unit": 4, "q": "What is the nationality adjective for someone from France?", "opts": ["French", "Francian", "Frenchian", "Francese"], "explain": "France → French."}, {"id": "E12", "unit": 4, "q": "What is the nationality adjective for someone from Japan?", "opts": ["Japanese", "Japanic", "Japander", "Japaner"], "explain": "Japan → Japanese."}, {"id": "E13", "unit": 4, "q": "Which word means 'a document you need to travel to another country'?", "opts": ["passport", "ticket", "luggage", "souvenir"], "explain": "A passport is the official document required for international travel."}, {"id": "E14", "unit": 4, "q": "Which word means 'a holiday where transport, hotel, etc. are all included in one price'?", "opts": ["package holiday", "excursion", "tour guide", "travel agency"], "explain": "A package holiday bundles transport, accommodation, and other costs into a single price."}, {"id": "E15", "unit": 4, "q": "What is the past simple negative form of 'to be' for 'he'?", "opts": ["wasn't", "weren't", "isn't", "don't was"], "explain": "For he/she/it, the negative past of 'to be' is wasn't."}, {"id": "E16", "unit": 4, "q": "What is the past simple (affirmative) of the modal 'can'?", "opts": ["could", "canned", "can'd", "was can"], "explain": "The past simple form of can is could."}, {"id": "E17", "unit": 4, "q": "What is the negative past simple form of 'can'?", "opts": ["couldn't", "can'tn't", "wasn't can", "didn't can"], "explain": "The negative past form of can is couldn't."}, {"id": "E18", "unit": 4, "q": "Which of these is a type of RAIL transport?", "opts": ["train", "lorry", "ship", "helicopter"], "explain": "A train travels on rails, unlike road, air, or sea transport."}, {"id": "E19", "unit": 4, "q": "Which of these is a type of SEA transport?", "opts": ["ship", "tram", "van", "plane"], "explain": "A ship travels on the sea, unlike rail, road, or air transport."}, {"id": "E20", "unit": 4, "q": "Complete: 'There ___ a South African astronaut.'", "opts": ["was", "were", "is", "are"], "explain": "Singular subject (a South African astronaut) takes 'was' in the past simple."}, {"id": "E21", "unit": 5, "q": "Which job repairs cars, buses and lorries?", "opts": ["mechanic", "engineer", "plumber", "electrician"], "explain": "A mechanic repairs vehicles such as cars, buses and lorries."}, {"id": "E22", "unit": 5, "q": "Which job treats sick animals?", "opts": ["vet", "nurse", "doctor", "psychologist"], "explain": "A vet (veterinarian) treats sick or injured animals."}, {"id": "E23", "unit": 5, "q": "Which job designs buildings?", "opts": ["architect", "engineer", "designer", "builder"], "explain": "An architect designs buildings."}, {"id": "E24", "unit": 5, "q": "Which job writes news stories?", "opts": ["journalist", "author", "novelist", "lawyer"], "explain": "A journalist researches and writes news stories."}, {"id": "E25", "unit": 5, "q": "Where would a doctor most typically work?", "opts": ["clinic / hospital", "garage", "laboratory", "recording studio"], "explain": "Doctors typically work in a clinic or hospital."}, {"id": "E26", "unit": 5, "q": "Where would you find a mechanic working?", "opts": ["garage", "office", "school", "outdoors"], "explain": "A mechanic typically works in a garage."}, {"id": "E27", "unit": 5, "q": "Who is the author of The Hunger Games books?", "opts": ["Suzanne Collins", "Eoin Colfer", "James Proimos", "J.K. Rowling"], "explain": "Suzanne Collins is the author of The Hunger Games."}, {"id": "E28", "unit": 5, "q": "Who is the author of the Artemis Fowl books?", "opts": ["Eoin Colfer", "Suzanne Collins", "James Proimos", "J.K. Rowling"], "explain": "Eoin Colfer wrote the Artemis Fowl series."}, {"id": "E29", "unit": 5, "q": "What does 'genius' mean, according to the text?", "opts": ["a person with a lot of intelligence or skill", "the main bad person in a story", "television stations", "opinions or feelings about something"], "explain": "Genius is defined in the text as a person with a lot of intelligence or skill."}, {"id": "E30", "unit": 5, "q": "What does 'villain' mean, according to the text?", "opts": ["the main bad person in a story", "a person with a lot of intelligence or skill", "television stations", "all the information a person knows"], "explain": "Villain is defined in the text as the main bad person in a story."}], "medium": [{"id": "M1", "unit": 3, "q": "Complete: 'Taking photos is not permitted in the museum. You ___ do it.'", "opts": ["mustn't", "don't have to", "have to", "can"], "explain": "\"Not permitted\" signals prohibition, so we use mustn't."}, {"id": "M2", "unit": 3, "q": "Complete: 'You ___ buy a ticket to see a film at the cinema.'", "opts": ["have to", "don't have to", "mustn't", "must not"], "explain": "Buying a ticket is a necessary requirement, so we use have to."}, {"id": "M3", "unit": 3, "q": "Complete: 'We ___ drive to the shopping centre because there isn't a bus.'", "opts": ["have to", "don't have to", "mustn't", "can't"], "explain": "Because there's no bus, driving becomes necessary — have to."}, {"id": "M4", "unit": 3, "q": "Complete: 'We ___ use our mobile phones in class. It's against the rules.'", "opts": ["mustn't", "don't have to", "have to", "can"], "explain": "\"Against the rules\" signals prohibition — mustn't."}, {"id": "M5", "unit": 3, "q": "Complete: 'He ___ go to PE class because he has a note from the doctor.'", "opts": ["doesn't have to", "have to", "mustn't", "must"], "explain": "A doctor's note gives an exemption from an obligation — doesn't have to."}, {"id": "M6", "unit": 3, "q": "Rewrite using don't have to: 'It is not necessary for you to bring food to the party.'", "opts": ["You don't have to bring food to the party.", "You mustn't bring food to the party.", "You have to bring food to the party.", "You can't bring food to the party."], "explain": "\"Not necessary\" is expressed with don't have to."}, {"id": "M7", "unit": 3, "q": "Which sentence correctly uses an adverb of manner?", "opts": ["She sings beautifully.", "She sings beautiful.", "She beautiful sings.", "She is sings beautifully."], "explain": "Adverbs of manner describe verbs, formed here as beautiful → beautifully."}, {"id": "M8", "unit": 3, "q": "What is the correct adverb form of 'easy'?", "opts": ["easily", "easyly", "easyley", "easely"], "explain": "Adjectives ending in -y change to -ily: easy → easily."}, {"id": "M9", "unit": 3, "q": "What is the correct adverb form of 'terrible'?", "opts": ["terribly", "terriblely", "terribley", "terribally"], "explain": "Adjectives ending in -le often drop the -e and add -y: terrible → terribly."}, {"id": "M10", "unit": 3, "q": "In the Ultimate Frisbee rules, 'the person with the frisbee stays in one place — they mustn't move with it' tells us that:", "opts": ["players cannot run while holding the frisbee", "players must always be running", "there is no time limit in the game", "a referee decides all the rules"], "explain": "The rule mustn't move with it means a player holding the frisbee has to stay still."}, {"id": "M11", "unit": 4, "q": "What is the nationality adjective for someone from Switzerland?", "opts": ["Swiss", "Switzerlandish", "Swissian", "Switzer"], "explain": "Switzerland → Swiss."}, {"id": "M12", "unit": 4, "q": "What is the nationality adjective for someone from Wales?", "opts": ["Welsh", "Walesian", "Walesish", "Welshian"], "explain": "Wales → Welsh."}, {"id": "M13", "unit": 4, "q": "Complete: 'There ___ lots of experiments to do on the ISS.'", "opts": ["were", "was", "are", "is"], "explain": "Plural subject (lots of experiments) takes 'were' in the past simple."}, {"id": "M14", "unit": 4, "q": "Complete (negative): 'There ___ an International Space Station in the 1800s.'", "opts": ["wasn't", "weren't", "isn't", "didn't"], "explain": "Singular subject (an International Space Station) takes the negative 'wasn't'."}, {"id": "M15", "unit": 4, "q": "What is the correct past simple form of 'fly'?", "opts": ["flew", "flied", "flyed", "flown"], "explain": "Fly is irregular — its past simple form is flew."}, {"id": "M16", "unit": 4, "q": "What is the correct past simple form of 'try', following the spelling rule for consonant+y verbs?", "opts": ["tried", "tryed", "tryied", "tries"], "explain": "Verbs ending in consonant + y change y to ied: try → tried."}, {"id": "M17", "unit": 4, "q": "What is the correct past simple form of 'stop', following the doubling rule?", "opts": ["stopped", "stoped", "stopeed", "stopted"], "explain": "One-vowel-one-consonant verbs double the final consonant: stop → stopped."}, {"id": "M18", "unit": 4, "q": "Which -ed ending is pronounced as an extra syllable, /ɪd/?", "opts": ["chatted", "loved", "walked", "stopped"], "explain": "Verbs ending in a /t/ or /d/ sound, like chat, add an extra syllable: chatted /tʃætɪd/."}, {"id": "M19", "unit": 4, "q": "Why couldn't Richard Garriott work as an astronaut when he was young?", "opts": ["his eyesight was bad", "he wasn't determined enough", "he didn't like science", "he was too young"], "explain": "The text says his eyesight was bad, and he couldn't see well without glasses."}, {"id": "M20", "unit": 4, "q": "According to the text, how much did Thomas Cook's 1872 round-the-world tour cost?", "opts": ["£210", "£25,000", "£30 million", "£1,841"], "explain": "The text states the 1872 tour cost £210, worth over £25,000 in today's money."}, {"id": "M21", "unit": 5, "q": "Which word describes 'a place where scientific tests happen'?", "opts": ["laboratory", "clinic", "recording studio", "garage"], "explain": "A laboratory is a place for conducting scientific experiments and tests."}, {"id": "M22", "unit": 5, "q": "Which word describes 'a place with equipment for recording music'?", "opts": ["recording studio", "laboratory", "office", "outdoors"], "explain": "A recording studio is equipped for recording music or audio."}, {"id": "M23", "unit": 5, "q": "What was Suzanne Collins doing when she got the idea for The Hunger Games?", "opts": ["watching the news and a reality TV show", "reading a novel", "teaching English", "visiting Ireland"], "explain": "She was watching the news, then switched to a reality show and noticed little difference between them."}, {"id": "M24", "unit": 5, "q": "Who encouraged Suzanne Collins to try writing novels for children?", "opts": ["James Proimos", "Eoin Colfer", "her father", "her editor"], "explain": "James Proimos, an author she worked with on Generation O!, encouraged her to write novels."}, {"id": "M25", "unit": 5, "q": "Where was Eoin Colfer born?", "opts": ["Wexford, Ireland", "Dublin, Ireland", "Connecticut, US", "Tunisia"], "explain": "Eoin Colfer was born in Wexford, Ireland."}, {"id": "M26", "unit": 5, "q": "What inspired Eoin Colfer's love of writing?", "opts": ["exciting stories about Vikings he learned about at school", "his experience as an astronaut", "working in children's TV", "travelling to the US"], "explain": "The text says his love for writing came from exciting stories about Vikings that he learned about at school."}, {"id": "M27", "unit": 5, "q": "What is the title of Eoin Colfer's first book, based on his time in Tunisia?", "opts": ["Benny and Omar", "Artemis Fowl", "Iron Man: The Gauntlet", "Illegal"], "explain": "Benny and Omar was based on his experiences teaching in Tunisia."}, {"id": "M28", "unit": 5, "q": "In what year did Eoin Colfer write the first Artemis Fowl book?", "opts": ["2001", "1992", "1998", "2008"], "explain": "The text states he wrote the first Artemis Fowl book in 2001."}, {"id": "M29", "unit": 5, "q": "What does 'encouraged' mean in the text?", "opts": ["to tell a person to do something you believe is good", "t const UNIT_LABEL = {3:"Unit 3", 4:"Unit 4", 5:"Unit 5"};

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildShuffled(setKey){
  const src = QUESTION_DATA[setKey];
  const order = shuffleArr(src.map((_,i)=>i));
  return order.map(idx=>{
    const item = src[idx];
    const optOrder = shuffleArr(item.opts.map((_,i)=>i));
    const opts = optOrder.map(oi=>item.opts[oi]);
    const correctIndex = optOrder.indexOf(0);
    return { id:item.id, unit:item.unit, q:item.q, opts:opts, correctIndex:correctIndex, explain:item.explain };
  });
}

const state = {};
function labelLetter(i){ return ["ก","ข","ค","ง"][i]; }

function render(setKey){
  const panel = document.getElementById("panel-"+setKey);
  const st = state[setKey];
  let answeredCount = Object.keys(st.answered).length;
  let html = '';
  html += '<div class="toolbar">'
        + '<div class="score">ตอบถูก: '+st.correctCount+' / '+answeredCount+' (จากทั้งหมด '+st.questions.length+' ข้อ)'
        + '<div class="progresswrap"><div class="progressbar" style="width:'+(answeredCount/st.questions.length*100)+'%"></div></div>'
        + '</div>'
        + '<button class="reshuffle" onclick="reshuffle(\''+setKey+'\')">สลับข้อสอบใหม่ (สุ่มลำดับ)</button>'
        + '</div>';

  st.questions.forEach((item, qi)=>{
    const answered = st.answered[qi];
    html += '<div class="qcard">';
    html += '<div class="qnum">ข้อที่ '+(qi+1)+' จาก '+st.questions.length+'<span class="unittag">'+UNIT_LABEL[item.unit]+'</span></div>';
    html += '<div class="qtext">'+item.q+'</div>';
    item.opts.forEach((opt, oi)=>{
      let cls = 'opt';
      let disabled = '';
      if(answered !== undefined){
        disabled = 'disabled';
        if(oi === item.correctIndex) cls += ' correct';
        else if(oi === answered && answered !== item.correctIndex) cls += ' wrong';
      }
      html += '<button class="'+cls+'" '+disabled+' onclick="answer(\''+setKey+'\','+qi+','+oi+')">'
            + labelLetter(oi)+'. '+opt+'</button>';
    });
    html += '<div class="explain'+(answered!==undefined?' show':'')+'">'
          + '<b>'+(answered!==undefined ? (answered===item.correctIndex ? 'Correct — ' : 'Not quite — ') : '')+'</b>'
          + item.explain
          + '</div>';
    html += '</div>';
  });

  panel.innerHTML = html;
}

function answer(setKey, qi, oi){
  const st = state[setKey];
  if(st.answered[qi] !== undefined) return;
  st.answered[qi] = oi;
  if(oi === st.questions[qi].correctIndex) st.correctCount++;
  render(setKey);
}

function reshuffle(setKey){
  state[setKey] = { questions: buildShuffled(setKey), answered:{}, correctCount:0 };
  render(setKey);
}

["easy","medium","hard"].forEach(k=>{
  state[k] = { questions: buildShuffled(k), answered:{}, correctCount:0 };
  render(k);
});

document.querySelectorAll(".setbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".setbtn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.set).classList.add("active");
  });
});
</script>
